<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<title>EARTHWORM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%236b2a08'/><rect x='2' y='10' width='5' height='3' fill='%23d8482c'/><rect x='2' y='10' width='5' height='2' fill='%23fc7460'/><rect x='5' y='7' width='5' height='3' fill='%23d8482c'/><rect x='5' y='7' width='5' height='2' fill='%23fc7460'/><rect x='8' y='4' width='6' height='3' fill='%23d8482c'/><rect x='8' y='4' width='6' height='2' fill='%23fc7460'/><rect x='12' y='4' width='1' height='1' fill='%23000000'/></svg>">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: monospace;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #game {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #000;
    display: block;
  }
  #pad {
    position: fixed;
    bottom: 16px;
    left: 16px;
    width: 160px;
    height: 160px;
    touch-action: none;
    pointer-events: auto;
  }
  #fire {
    position: fixed;
    bottom: 40px;
    right: 32px;
    width: 96px;
    height: 96px;
    background: #c0392b;
    border: 4px solid #fff;
    border-radius: 50%;
    color: #fff;
    font-family: monospace;
    font-weight: bold;
    font-size: 18px;
    touch-action: none;
    user-select: none;
  }
  #fire:active { background: #e74c3c; }
  #throw {
    position: fixed;
    bottom: 148px;
    right: 44px;
    width: 72px;
    height: 72px;
    background: #8b4513;
    border: 4px solid #fff;
    border-radius: 50%;
    color: #fff;
    font-family: monospace;
    font-weight: bold;
    font-size: 14px;
    touch-action: none;
    user-select: none;
  }
  #throw:active { background: #c87830; }
  .padbtn {
    position: absolute;
    width: 56px;
    height: 56px;
    background: rgba(255,255,255,0.15);
    border: 3px solid #fff;
    color: #fff;
    font-family: monospace;
    font-weight: bold;
    font-size: 24px;
    text-align: center;
    line-height: 50px;
  }
  .padbtn:active { background: rgba(255,255,255,0.4); }
  #pU { left: 52px; top: 0; }
  #pD { left: 52px; top: 104px; }
  #pL { left: 0; top: 52px; }
  #pR { left: 104px; top: 52px; }
  @media (hover: hover) and (pointer: fine) {
    #pad, #fire, #throw { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="pad">
  <div class="padbtn" id="pU">^</div>
  <div class="padbtn" id="pD">v</div>
  <div class="padbtn" id="pL">&lt;</div>
  <div class="padbtn" id="pR">&gt;</div>
</div>
<button id="fire">SQUIRT</button>
<button id="throw">BOW</button>
<script>
(() => {
  // ====== Pixel canvas setup ======
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  // Internal pixel resolution (8-bit feel)
  const VW = 256;   // 16 cols
  const VH = 224;   // 14 rows of play + HUD
  const TILE = 16;
  const COLS = 16;
  const HUD_H = 16;
  const PLAY_H = VH - HUD_H;
  const ROWS = PLAY_H / TILE; // 13 rows of tiles

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const scale = Math.max(1, Math.floor(Math.min(w / VW, h / VH)));
    canvas.width = VW;
    canvas.height = VH;
    canvas.style.width = (VW * scale) + 'px';
    canvas.style.height = (VH * scale) + 'px';
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  // ====== Palette (NES-ish) ======
  const C = {
    sky:    '#5c94fc',
    grass:  '#3cbcfc', // not used directly
    grassG: '#80d010',
    dirt1:  '#a85820',
    dirt2:  '#8b3a0e',
    dirt3:  '#6b2a08',
    tunnel: '#2a1408',
    rock1:  '#bcbcbc',
    rock2:  '#7c7c7c',
    rockD:  '#404040',
    worm1:  '#fc7460',
    worm2:  '#d8482c',
    wormE:  '#000000',
    pd1:    '#c87830',
    pd2:    '#8b4513',
    pdBel:  '#f0c878',
    sq1:    '#74dc54',   // squiggle bright green
    sq2:    '#2c8814',   // squiggle dark green
    sqEye:  '#000000',
    eye:    '#ffffff',
    pupil:  '#000000',
    squirt: '#a8e8ff',
    help1:  '#7cd8fc',   // conjured helper worm
    help2:  '#2c6cac',
    steel:  '#c0c0d8',   // knight helm
    steelD: '#6c6c8c',
    magic1: '#a060fc',   // magician purple
    magic2: '#5c2c9c',
    prop1:  '#fc7460',   // propeller beanie
    prop2:  '#3cbcfc',
    coin1:  '#fce040',
    coin2:  '#c89000',
    slug1:  '#9cfc70',   // slugbuck bright green
    slug2:  '#2c8814',
    jest1:  '#fc4848',   // jester ant motley
    jest2:  '#a060fc',
    jestS:  '#c8a060',   // his face
    antD:   '#2a1c10',
    paper:  '#e8d0a0',   // wanted poster
    paperD: '#7c5a2c',
    horn1:  '#fcd000',   // king hornet yellow
    horn2:  '#181008',   // ...and his black
    wing:   '#bcd8f0',
    lens:   '#2a4a6a',
    mole1:  '#8b5a2b',   // queen mole brown
    mole2:  '#4a2d10',
    moleBel:'#c89060',
    bowL:   '#fc6464',   // her red bow
    bowD:   '#a01818',
    text:   '#ffffff',
    yellow: '#fce040',
    red:    '#fc3030',
    carrot: '#fc8c20',   // pointer carrot
    candy:  '#ff9ec4',   // lollypop pink
    cone:   '#f05a10',   // traffic cone, kept clear of the carrot
    beet1:  '#5a6a7a',   // knight beetle carapace
    beet2:  '#2e3a46',
    bun1:   '#e8e0d0',   // stuffed rabbit, kept clear of the teddy's honey
    bun2:   '#a89888',
    ant1:   '#7a3a1c',   // worker ant
    ted1:   '#d8a860',   // teddy bear, kept well clear of the prairie dog browns
    ted2:   '#8a6030',
  };

  // ====== Tiles ======
  // 0 = dirt, 1 = empty (tunnel), 2 = rock, 3 = falling rock
  const DIRT = 0, EMPTY = 1, ROCK = 2, FALLING = 3;
  let grid; // [r][c]

  // Use a per-tile dirt variant for visual interest
  let dirtSeed; // [r][c] -> small integer

  function makeLevel(levelIdx) {
    grid = [];
    dirtSeed = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      const seedRow = [];
      for (let c = 0; c < COLS; c++) {
        row.push(DIRT);
        seedRow.push((Math.random() * 4) | 0);
      }
      grid.push(row);
      dirtSeed.push(seedRow);
    }
    // Carve a starting chamber for the worm so all 4 directions work immediately
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 3; c++) carve(r, c);
    }
    carve(2, 0); carve(2, 1);
    // A couple of horizontal scratches
    for (let i = 0; i < 3 + levelIdx; i++) {
      const r = 2 + ((Math.random() * (ROWS - 3)) | 0);
      const c0 = (Math.random() * (COLS - 4)) | 0;
      const len = 2 + ((Math.random() * 4) | 0);
      for (let k = 0; k < len; k++) carve(r, c0 + k);
    }
    // Place rocks
    const nRocks = 4 + levelIdx;
    let placed = 0, tries = 0;
    while (placed < nRocks && tries < 200) {
      tries++;
      const r = 1 + ((Math.random() * (ROWS - 3)) | 0);
      const c = (Math.random() * COLS) | 0;
      if (grid[r][c] === DIRT && grid[r+1] && grid[r+1][c] === DIRT) {
        grid[r][c] = ROCK;
        placed++;
      }
    }
  }

  function carve(r, c) {
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) grid[r][c] = EMPTY;
  }

  // ====== Entities ======
  // Player worm: pixel-positioned, but movement is grid-aligned along axes.
  const player = {
    x: 0, y: 0,         // top-left pixel of 16x16 sprite (within play area)
    dir: 'R',           // R, L, U, D
    speed: 1.5,         // pixels per frame
    alive: true,
    squirting: false,
    squirtTimer: 0,
    squirtTarget: null,
    invuln: 0,
    bodyTrail: [],      // recent positions to draw worm body
  };

  // Prairie dogs
  let pds = [];

  function spawnPlayer() {
    player.x = TILE;       // start one tile in so up/left aren't blocked by boundary
    player.y = TILE;
    player.dir = 'R';
    player.alive = true;
    player.invuln = 60;
    player.squirting = false;
    player.squirtTimer = 0;
    player.squirtTarget = null;
    player.bodyTrail = [];
    player.speed = equipped === 'slugcrown' ? 2.1 : 1.5;
  }

  function minionSpeed(type, levelIdx) {
    const diffSpd = [-0.2, 0, 0.15][difficulty];
    const base = 0.4 + Math.random() * 0.15 + levelIdx * 0.03 + diffSpd;
    if (type === 'pd')  return Math.max(0.2, base);
    if (type === 'ant') return Math.max(0.25, base * 1.35);   // ants scurry
    return Math.max(0.15, base * 0.6);                        // squiggles dawdle
  }

  function makeMinion(type, x, y, speed) {
    return {
      type, x, y,
      dir: ['L','R','U','D'][(Math.random()*4)|0],
      speed,
      alive: true,
      pumped: 0,          // 0..4 -> exploded
      pumpDecay: 0,
      stunned: 0,
      thinkTimer: 0,
      wiggle: 0,          // animation phase for squiggle
    };
  }

  function spawnPDs(levelIdx) {
    pds = [];
    const diffN = [-1, 0, 1][difficulty];     // easy: -1, normal: 0, hard: +1
    const n = Math.max(1, 2 + Math.min(4, levelIdx) + diffN);
    const nSquiggle = 1 + Math.min(2, Math.floor(levelIdx / 2));
    // Ants only start turning up once you are a burrow or two down
    const nAnt = levelIdx < 2 ? 0 : Math.min(3, Math.floor(levelIdx / 2));
    const spawn = (type) => {
      let tries = 0;
      while (tries < 80) {
        tries++;
        const r = 3 + ((Math.random() * (ROWS - 4)) | 0);
        const c = 4 + ((Math.random() * (COLS - 5)) | 0);
        if (grid[r][c] !== DIRT) continue;
        grid[r][c] = EMPTY;
        pds.push(makeMinion(type, c * TILE, r * TILE, minionSpeed(type, levelIdx)));
        return true;
      }
      return false;
    };
    // Boss burrows come with a proper crowd on top of whatever the boss calls up
    const bossSpawner = levelIdx >= KNIGHT_LEVEL ? spawnKnight
                      : levelIdx === JESTER_LEVEL ? spawnJester
                      : levelIdx === QUEEN_LEVEL ? spawnQueen
                      : levelIdx === KING_LEVEL ? spawnKing : null;
    if (bossSpawner) {
      bossSpawner();
      spawn('pd');
      spawn('pd');
      spawn('pd');
      spawn('squiggle');
      spawn('squiggle');
      spawn('ant');
      spawn('ant');
      return;
    }
    for (let i = 0; i < n; i++) spawn('pd');
    for (let i = 0; i < nSquiggle; i++) spawn('squiggle');
    for (let i = 0; i < nAnt; i++) spawn('ant');
  }

  // ====== The Queen Mole ======
  // Twice the size of everything else, soaks several hits, and keeps calling
  // up prairie dogs and squiggles until she goes down.
  const KING_LEVEL = 5;
  const QUEEN_LEVEL = 10;
  const JESTER_LEVEL = 15;
  const KNIGHT_LEVEL = 20;
  const FINAL_LEVEL = KNIGHT_LEVEL;
  const BOSS_SIZE = 32;
  const QUEEN_SIZE = BOSS_SIZE;
  const KING_SIZE = BOSS_SIZE;
  const QUEEN_MAX_MINIONS = 8;
  const QUEEN_SPAWN_GAP = 150;
  const KING_MAX_MINIONS = 8;
  const KING_SPAWN_GAP = 170;
  const JESTER_MAX_MINIONS = 9;
  const JESTER_SPAWN_GAP = 140;
  const KNIGHT_MAX_MINIONS = 10;
  const KNIGHT_SPAWN_GAP = 130;

  function isBoss(p) {
    return p.type === 'queen' || p.type === 'king' ||
           p.type === 'jester' || p.type === 'knight';
  }

  // The Knight Beetle carries his shield on the side he is facing. Ink only
  // tells when you are round the back of him.
  function behindKnight(b) {
    const px1 = player.x + 8, py1 = player.y + 8;
    const cx = entCX(b), cy = entCY(b);
    if (b.dir === 'L') return px1 > cx;
    if (b.dir === 'R') return px1 < cx;
    if (b.dir === 'U') return py1 > cy;
    return py1 < cy;
  }

  // Both bosses get meaner once they are down to half health.
  function enraged(p) { return p.hp <= p.maxHp / 2; }

  // Bosses do not just sit there and take it. Hold one with a squirt and he
  // winds up, then swings at the worm on the other end of the ink.
  const LASH_TIME = 68;        // frames you can hold a boss before he swings
  const LASH_TIME_RAGE = 48;   // an angry boss swings much sooner
  const LASH_WINDUP = 20;      // telegraphed frames before the swing lands
  function lashLimit(p) { return enraged(p) ? LASH_TIME_RAGE : LASH_TIME; }
  function lashWinding(p) {
    return !!p && isBoss(p) && p.lash > 0 && p.lash >= lashLimit(p) - LASH_WINDUP;
  }

  function spawnQueen() {
    const qc = COLS - 4, qr = ROWS - 4;
    for (let r = qr; r < qr + 2; r++) {
      for (let c = qc; c < qc + 2; c++) carve(r, c);
    }
    const hp = 8 + difficulty * 2;
    pds.push({
      type: 'queen',
      x: qc * TILE,
      y: qr * TILE,
      dir: 'L',
      speed: 0.46 + difficulty * 0.1,
      alive: true,
      pumped: 0,
      pumpDecay: 0,
      stunned: 0,
      thinkTimer: 0,
      wiggle: 0,
      hp, maxHp: hp,
      lash: 0,
      hurtFlash: 0,
      spawnTimer: 120,
    });
  }

  function spawnKing() {
    const kc = COLS - 4, kr = 2;
    for (let r = kr; r < kr + 2; r++) {
      for (let c = kc; c < kc + 2; c++) carve(r, c);
    }
    const hp = 6 + difficulty;
    pds.push({
      type: 'king',
      x: kc * TILE,
      y: kr * TILE,
      dir: 'L',
      speed: 0.42 + difficulty * 0.1,
      alive: true,
      pumped: 0,
      pumpDecay: 0,
      stunned: 0,
      thinkTimer: 0,
      wiggle: 0,
      hp, maxHp: hp,
      lash: 0,
      hurtFlash: 0,
      spawnTimer: 140,
      mode: 'hover',
      phase: 90,
      vx: 0, vy: 0,
    });
  }

  // The Knight Beetle: the last one down, armoured on the front and given to
  // charging in a straight line once he has you lined up.
  function spawnKnight() {
    const kc = 2, kr = 2;
    for (let r = kr; r < kr + 2; r++) {
      for (let c = kc; c < kc + 2; c++) carve(r, c);
    }
    const hp = 12 + difficulty * 2;
    pds.push({
      type: 'knight',
      x: kc * TILE,
      y: kr * TILE,
      dir: 'D',
      speed: 0.44 + difficulty * 0.08,
      alive: true,
      pumped: 0,
      pumpDecay: 0,
      stunned: 0,
      thinkTimer: 0,
      wiggle: 0,
      hp, maxHp: hp,
      lash: 0,
      hurtFlash: 0,
      spawnTimer: 130,
      mode: 'walk',
      phase: 150,
    });
  }

  function spawnJester() {
    const jc = 2, jr = ROWS - 4;
    for (let r = jr; r < jr + 2; r++) {
      for (let c = jc; c < jc + 2; c++) carve(r, c);
    }
    const hp = 10 + difficulty * 2;
    pds.push({
      type: 'jester',
      x: jc * TILE,
      y: jr * TILE,
      dir: 'R',
      speed: 0.52 + difficulty * 0.1,
      alive: true,
      pumped: 0,
      pumpDecay: 0,
      stunned: 0,
      thinkTimer: 0,
      wiggle: 0,
      hp, maxHp: hp,
      lash: 0,
      hurtFlash: 0,
      spawnTimer: 120,
      mode: 'walk',
      phase: 200,
    });
  }

  // He will not hop away mid-squirt: updatePDs skips a boss that is being
  // pumped, so moveJester never runs while you have hold of him.
  function jesterHop(p) {
    const spots = [];
    for (let i = 0; i < 50; i++) {
      const r = (Math.random() * (ROWS - 1)) | 0;
      const c = (Math.random() * (COLS - 1)) | 0;
      const x = c * TILE, y = r * TILE;
      if (!canOccupy(x, y, BOSS_SIZE)) continue;
      spots.push({ x, y, d: Math.hypot(x - player.x, y - player.y) });
    }
    if (!spots.length) return;
    spots.sort((a, b) => a.d - b.d);
    const pick = spots.find(s => s.d > 40) || spots[0];
    p.x = pick.x;
    p.y = pick.y;
    carveAt(p.x, p.y, BOSS_SIZE);
  }

  // Trundles after you, then rears up and charges in a straight line until
  // something stops him. The charge is when his back is easiest to get at.
  function moveKnight(p) {
    const rage = enraged(p);
    p.spawnTimer--;
    if (p.spawnTimer <= 0) {
      p.spawnTimer = rage ? Math.round(KNIGHT_SPAWN_GAP * 0.6) : KNIGHT_SPAWN_GAP;
      bossCallsForHelp(p, KNIGHT_MAX_MINIONS);
    }

    p.phase--;
    if (p.phase <= 0) {
      if (p.mode === 'walk')      { p.mode = 'rear';   p.phase = 34; }
      else if (p.mode === 'rear') { p.mode = 'charge'; p.phase = rage ? 70 : 55; }
      else                        { p.mode = 'walk';   p.phase = rage ? 110 : 170; }
    }
    if (p.mode === 'rear') return;        // dug in, winding up

    p.thinkTimer--;
    const ax = Math.round(p.x / TILE) * TILE;
    const ay = Math.round(p.y / TILE) * TILE;
    const aligned = Math.abs(p.x - ax) < 0.6 && Math.abs(p.y - ay) < 0.6;
    // He only picks a new way while walking; a charge holds its line
    if (p.mode === 'walk' && aligned && p.thinkTimer <= 0) {
      p.thinkTimer = 30;
      const dxp = (player.x + 8) - entCX(p);
      const dyp = (player.y + 8) - entCY(p);
      const order = Math.abs(dxp) > Math.abs(dyp)
        ? [dxp > 0 ? 'R' : 'L', dyp > 0 ? 'D' : 'U']
        : [dyp > 0 ? 'D' : 'U', dxp > 0 ? 'R' : 'L'];
      const open = ['L','R','U','D'].filter(d => {
        const mx = d === 'L' ? -1 : d === 'R' ? 1 : 0;
        const my = d === 'U' ? -1 : d === 'D' ? 1 : 0;
        return canOccupy(ax + mx * TILE, ay + my * TILE, BOSS_SIZE);
      });
      const pick = order.find(d => open.includes(d));
      if (pick) p.dir = pick;
      else if (open.length) p.dir = open[(Math.random() * open.length) | 0];
    }

    let dx = 0, dy = 0;
    if (p.dir === 'L') dx = -1;
    else if (p.dir === 'R') dx = 1;
    else if (p.dir === 'U') dy = -1;
    else dy = 1;
    if (dx !== 0) p.y = ay;
    if (dy !== 0) p.x = ax;

    const sp = p.speed * (p.mode === 'charge' ? (rage ? 4.2 : 3.4) : 1);
    const nx = p.x + dx * sp;
    const ny = p.y + dy * sp;
    if (canOccupy(nx, ny, BOSS_SIZE)) {
      p.x = nx;
      p.y = ny;
      carveAt(p.x, p.y, BOSS_SIZE);
    } else {
      p.x = ax;            // back onto the grid, so he can pick a new way
      p.y = ay;
      p.thinkTimer = 0;
      if (p.mode === 'charge') { p.mode = 'walk'; p.phase = 80; }   // hit a wall
    }
  }

  function moveJester(p) {
    const rage = enraged(p);
    p.wiggle += 0.3;

    p.spawnTimer--;
    if (p.spawnTimer <= 0) {
      p.spawnTimer = rage ? Math.round(JESTER_SPAWN_GAP * 0.6) : JESTER_SPAWN_GAP;
      bossCallsForHelp(p, JESTER_MAX_MINIONS);
    }

    p.phase--;
    if (p.phase <= 0) {
      if (p.mode === 'walk') {
        p.mode = 'vanish';
        p.phase = 30;
      } else if (p.mode === 'vanish') {
        jesterHop(p);
        p.mode = 'appear';
        p.phase = 20;
      } else {
        p.mode = 'walk';
        p.phase = rage ? 150 : 220;
      }
    }
    if (p.mode !== 'walk') return;     // he holds still while popping in and out

    p.thinkTimer--;
    const ax = Math.round(p.x / TILE) * TILE;
    const ay = Math.round(p.y / TILE) * TILE;
    const aligned = Math.abs(p.x - ax) < 0.6 && Math.abs(p.y - ay) < 0.6;
    if (aligned && p.thinkTimer <= 0) {
      p.thinkTimer = 26;
      const dxp = (player.x + 8) - entCX(p);
      const dyp = (player.y + 8) - entCY(p);
      const order = Math.abs(dxp) > Math.abs(dyp)
        ? [dxp > 0 ? 'R' : 'L', dyp > 0 ? 'D' : 'U']
        : [dyp > 0 ? 'D' : 'U', dxp > 0 ? 'R' : 'L'];
      const open = ['L','R','U','D'].filter(d => {
        const mx = d === 'L' ? -1 : d === 'R' ? 1 : 0;
        const my = d === 'U' ? -1 : d === 'D' ? 1 : 0;
        return canOccupy(ax + mx * TILE, ay + my * TILE, BOSS_SIZE);
      });
      const pick = order.find(d => open.includes(d));
      if (pick) p.dir = pick;
      else if (open.length) p.dir = open[(Math.random() * open.length) | 0];
    }

    let dx = 0, dy = 0;
    if (p.dir === 'L') dx = -1;
    else if (p.dir === 'R') dx = 1;
    else if (p.dir === 'U') dy = -1;
    else dy = 1;
    if (dx !== 0) p.y = ay;
    if (dy !== 0) p.x = ax;

    const sp = p.speed * (rage ? 1.3 : 1);
    const nx = p.x + dx * sp;
    const ny = p.y + dy * sp;
    if (canOccupy(nx, ny, BOSS_SIZE)) {
      p.x = nx;
      p.y = ny;
      carveAt(p.x, p.y, BOSS_SIZE);
    } else {
      p.x = ax;            // back onto the grid, so he can pick a new way
      p.y = ay;
      p.thinkTimer = 0;
    }
  }

  function bossCallsForHelp(q, cap) {
    const court = pds.filter(p => p.alive && !isBoss(p)).length;
    if (court >= cap) return;
    const qc = Math.round(q.x / TILE), qr = Math.round(q.y / TILE);
    const spots = [];
    for (let r = qr - 1; r <= qr + 2; r++) {
      for (let c = qc - 1; c <= qc + 2; c++) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
        if (grid[r][c] === ROCK || grid[r][c] === FALLING) continue;
        spots.push([r, c]);
      }
    }
    if (!spots.length) return;
    const [r, c] = spots[(Math.random() * spots.length) | 0];
    grid[r][c] = EMPTY;
    const roll = Math.random();
    const type = roll < 0.4 ? 'pd' : roll < 0.75 ? 'squiggle' : 'ant';
    pds.push(makeMinion(type, c * TILE, r * TILE, minionSpeed(type, level)));
  }

  function moveQueen(p) {
    const rage = enraged(p);
    p.spawnTimer--;
    if (p.spawnTimer <= 0) {
      p.spawnTimer = rage ? Math.round(QUEEN_SPAWN_GAP * 0.6) : QUEEN_SPAWN_GAP;
      bossCallsForHelp(p, QUEEN_MAX_MINIONS);
    }

    p.thinkTimer--;
    const ax = Math.round(p.x / TILE) * TILE;
    const ay = Math.round(p.y / TILE) * TILE;
    const aligned = Math.abs(p.x - ax) < 0.6 && Math.abs(p.y - ay) < 0.6;
    if (aligned && p.thinkTimer <= 0) {
      p.thinkTimer = 30;
      const dxp = (player.x + 8) - (p.x + QUEEN_SIZE / 2);
      const dyp = (player.y + 8) - (p.y + QUEEN_SIZE / 2);
      const order = Math.abs(dxp) > Math.abs(dyp)
        ? [dxp > 0 ? 'R' : 'L', dyp > 0 ? 'D' : 'U']
        : [dyp > 0 ? 'D' : 'U', dxp > 0 ? 'R' : 'L'];
      const open = ['L','R','U','D'].filter(d => {
        const mx = d === 'L' ? -1 : d === 'R' ? 1 : 0;
        const my = d === 'U' ? -1 : d === 'D' ? 1 : 0;
        return canOccupy(ax + mx * TILE, ay + my * TILE, QUEEN_SIZE);
      });
      const pick = order.find(d => open.includes(d));
      if (pick) p.dir = pick;
      else if (open.length) p.dir = open[(Math.random() * open.length) | 0];
    }

    let dx = 0, dy = 0;
    if (p.dir === 'L') dx = -1;
    else if (p.dir === 'R') dx = 1;
    else if (p.dir === 'U') dy = -1;
    else dy = 1;
    if (dx !== 0) p.y = ay;
    if (dy !== 0) p.x = ax;

    const sp = p.speed * (rage ? 1.35 : 1);
    const nx = p.x + dx * sp;
    const ny = p.y + dy * sp;
    if (canOccupy(nx, ny, QUEEN_SIZE)) {
      p.x = nx;
      p.y = ny;
      carveAt(p.x, p.y, QUEEN_SIZE);
    } else {
      p.x = ax;            // back onto the grid, so she can pick a new way
      p.y = ay;
      p.thinkTimer = 0;
    }
  }

  // The King Hornet flies: dirt does not slow him and he carves nothing, so
  // you cannot wall him out. Only rocks and the edges stop him. He drifts in,
  // winds up, dashes at you, then has to catch his breath - that pause is
  // when you squirt him.
  function moveKing(p) {
    const rage = enraged(p);
    p.wiggle += 0.6;

    p.spawnTimer--;
    if (p.spawnTimer <= 0) {
      p.spawnTimer = rage ? Math.round(KING_SPAWN_GAP * 0.6) : KING_SPAWN_GAP;
      bossCallsForHelp(p, KING_MAX_MINIONS);
    }

    p.phase--;
    if (p.phase <= 0) {
      if (p.mode === 'hover') {
        p.mode = 'wind';
        p.phase = rage ? 16 : 24;
      } else if (p.mode === 'wind') {
        const dxp = (player.x + 8) - entCX(p);
        const dyp = (player.y + 8) - entCY(p);
        const len = Math.hypot(dxp, dyp) || 1;
        p.vx = dxp / len;
        p.vy = dyp / len;
        p.mode = 'dash';
        p.phase = 34;
      } else if (p.mode === 'dash') {
        p.mode = 'rest';
        p.phase = rage ? 34 : 54;      // the opening
      } else {
        p.mode = 'hover';
        p.phase = rage ? 40 : 70;
      }
    }

    let dx = 0, dy = 0, sp = 0;
    if (p.mode === 'hover') {
      const dxp = (player.x + 8) - entCX(p);
      const dyp = (player.y + 8) - entCY(p);
      const len = Math.hypot(dxp, dyp) || 1;
      dx = dxp / len;
      dy = dyp / len;
      sp = p.speed * (rage ? 1.3 : 1);
    } else if (p.mode === 'dash') {
      dx = p.vx;
      dy = p.vy;
      sp = p.speed * (rage ? 5.5 : 4.5);
    }
    if (sp <= 0) return;

    // Only the edges of the burrow stop him - rocks and dirt do not.
    const nx = Math.max(0, Math.min(COLS * TILE - KING_SIZE, p.x + dx * sp));
    const ny = Math.max(0, Math.min(PLAY_H - KING_SIZE, p.y + dy * sp));
    if (p.mode === 'dash' && nx === p.x && ny === p.y) p.phase = 0;   // hit the wall
    p.x = nx;
    p.y = ny;
  }

  // Centre and contact radius of any enemy, so the big one is handled too.
  function entHalf(p) { return isBoss(p) ? BOSS_SIZE / 2 : 8; }
  function entCX(p) { return p.x + entHalf(p); }
  function entCY(p) { return p.y + entHalf(p); }

  // One full inflation landed on `tgt`. Returns true if the squirter lets go.
  function inflateHit(tgt, byHelper) {
    if (!isBoss(tgt)) {
      tgt.alive = false;
      awardKill(tgt, 'pop', byHelper);
      return true;
    }
    tgt.hp--;
    tgt.lash = 0;
    tgt.pumped = 0;
    tgt.pumpDecay = 0;
    tgt.hurtFlash = 36;
    tgt.stunned = 45;
    if (tgt.hp <= 0) {
      tgt.alive = false;
      awardKill(tgt, 'pop', byHelper);
    }
    return true;
  }

  // ====== Helpers ======
  function tileAt(x, y) {
    const c = Math.floor(x / TILE);
    const r = Math.floor(y / TILE);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return EMPTY;
    return grid[r][c];

  function setTile(r, c, v) {
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) grid[r][c] = v;

  // Check if the 16x16 entity at (x,y) is fully inside non-rock tiles.
  function canOccupy(x, y, size) {
    const s = size || TILE;
    if (x < 0 || y < 0 || x + s > COLS*TILE || y + s > PLAY_H) return false;
    // Sample the edges, plus every tile boundary in between for big bodies
    const xs = [x+1], ys = [y+1];
    for (let o = TILE; o < s; o += TILE) { xs.push(x+o); ys.push(y+o); }
    xs.push(x+s-1); ys.push(y+s-1);
    for (const cy of ys) {
      for (const cx of xs) {
        const t = tileAt(cx, cy);
        if (t === ROCK || t === FALLING) return false;
      }
    }
    return true;
  }

  // Carve dirt under the entity's footprint.
  function carveAt(x, y, size) {
    const s = size || TILE;
    const c0 = Math.floor((x+2) / TILE);
    const r0 = Math.floor((y+2) / TILE);
    const c1 = Math.floor((x+s-3) / TILE);
    const r1 = Math.floor((y+s-3) / TILE);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] === DIRT) {
          grid[r][c] = EMPTY;
        }
      }
    }
  }
