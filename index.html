  function drawShop() {
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(0, HUD_H, VW, PLAY_H);
    drawCenter('HAT SHOP', 24, C.yellow, 2);

    // Purse: both currencies
    const pw = (8 + String(coins).length * 4) + 14 + (8 + String(slugs).length * 4);
    let pxx = Math.floor((VW - pw) / 2);
    pxx += drawPurse(pxx, 44, 'coin', coins, C.coin1) + 14;
    drawPurse(pxx, 44, 'slug', slugs, C.slug1);

    clampShopScroll();
    shopBounds.length = 0;
    const baseY = 58, lineH = 14;
    for (let v = 0; v < SHOP_VISIBLE; v++) {
      const i = shopScroll + v;
      if (i >= SHOP_ROWS) break;
      const y = baseY + v * lineH;
      const sel = i === shopIndex;
      if (i === HATS.length) {
        const label = 'BACK';
        const x = Math.floor((VW - label.length * 4) / 2);
        drawText(label, x, y, sel ? C.yellow : C.text, 1);
        if (sel) drawPointer(x - 12, y);
        shopBounds.push({ x: x - 16, y: y - 5, w: label.length * 4 + 24, h: 13, idx: i });
        continue;
      }
      const h = HATS[i];
      drawHat(28, y - 1, h.id);
      drawText(h.name, 44, y, sel ? C.yellow : C.text, 1);
      if (equipped === h.id) {
        drawText('WORN', 168, y, C.sq1, 1);
      } else if (owned[h.id]) {
        drawText('OWNED', 168, y, C.text, 1);
      } else if (h.cur === 'unlock') {
        drawText('LOCKED', 168, y, C.red, 1);
      } else {
        const purse = h.cur === 'slug' ? slugs : coins;
        const ok = h.cur === 'slug' ? C.slug1 : C.coin1;
        if (h.cur === 'slug') drawSlugBuck(168, y - 1);
        else drawCoin(168, y - 1);
        drawText(String(h.cost), 178, y, purse >= h.cost ? ok : C.red, 1);
      }
      if (sel) drawPointer(14, y);
      shopBounds.push({ x: 12, y: y - 5, w: 216, h: 13, idx: i });
    }

    // Arrows when there is more list above or below the window
    if (shopScroll > 0) drawScrollArrow(232, baseY - 7, true);
    if (shopScroll + SHOP_VISIBLE < SHOP_ROWS) {
      drawScrollArrow(232, baseY + SHOP_VISIBLE * lineH - 6, false);
    }

    // Blurb for whatever is highlighted
    const descY = baseY + SHOP_VISIBLE * lineH + 4;
    const sel = shopIndex < HATS.length ? HATS[shopIndex] : null;
    const desc = !sel ? 'BACK TO THE MENU.'
      : (sel.lockedDesc && !owned[sel.id]) ? sel.lockedDesc
      : sel.desc;
    drawCenter(desc, descY, C.text, 1);
    if (shopMsgTimer > 0) drawCenter(shopMsg, descY + 10, shopMsgColor, 1);
    drawCenter('ENTER: BUY OR WEAR', VH - 14, C.text, 1);
  }

  // Render one row of the scoring table: little sprite, name, squirt and rock totals
  function drawScoreRow(y, type, name, squirtPts, rockPts) {
    const labelColor = type === 'squiggle' ? C.sq1 : type === 'ant' ? C.ant1 : C.pd1;
    // Tiny icon: 8x8-ish reduced sprite at left
    const iconX = 36;
    if (type === 'ant') {
      // small ant: three beads and a pair of antennae
      rect(iconX + 2, y - 1, 3, 2, C.antD);
      rect(iconX + 2, y + 1, 3, 2, C.ant1);
      rect(iconX + 1, y + 3, 5, 3, C.antD);
      px(iconX + 1, y - 2, C.antD);
      px(iconX + 5, y - 2, C.antD);
      px(iconX, y + 1, C.antD);
      px(iconX + 6, y + 1, C.antD);
    } else if (type === 'pd') {
      // small prairie-dog: oval body + dot eyes
      rect(iconX,     y - 1, 7, 7, C.pd2);
      rect(iconX + 1, y,     5, 6, C.pd1);
      rect(iconX + 2, y + 2, 3, 3, C.pdBel);
      px(iconX + 2, y + 1, C.pupil);
      px(iconX + 4, y + 1, C.pupil);
    } else {
      // small squiggle: 4 dots in a wave
      for (let i = 0; i < 4; i++) {
        const wave = (i % 2) ? 1 : -1;
        rect(iconX + i * 2, y + 2 + wave, 2, 2, C.sq2);
        px(iconX + i * 2, y + 2 + wave, C.sq1);
      }
      px(iconX + 7, y + 1, C.pupil);
    }
    drawText(name, iconX + 12, y, labelColor, 1);
    // Right-align point values
    const sLabel = 'POP ' + squirtPts;
    const rLabel = 'ROCK ' + rockPts;
    drawText(sLabel, 140, y, C.yellow, 1);
    drawText(rLabel, 184, y, C.rock1, 1);
  }

  function drawHowTo() {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, HUD_H, VW, PLAY_H);
    drawCenter('HOW TO PLAY', 28, C.yellow, 1);
    const lines = [
      ['ARROWS', 'MOVE AND DIG'],
      ['SPACE',  'SQUIRT INK'],
      ['',       ''],
      ['INFLATE PRAIRIE DOGS'],
      ['WITH INK UNTIL THEY POP'],
      ['OR DROP ROCKS ON THEM'],
      ['',       ''],
      ['EVERY KILL PAYS COINS'],
      ['SPEND THEM IN THE SHOP'],
      ['ON HATS THAT HELP YOU'],
      ['',       ''],
      ['BOSSES ON 5 10 15 AND 20'],
      ['LET GO BEFORE THEY SWING'],
    ];
    let y = 50;
    for (const [a, b] of lines) {
      if (b) {
        drawText(a, 40, y, C.yellow, 1);
        drawText(b, 100, y, C.text, 1);
      } else if (a) {
        drawCenter(a, y, C.text, 1);
      }
      y += 12;
    }
    if ((Math.floor(performance.now()/400) % 2) === 0) {
      drawCenter('PRESS ANY KEY', VH - 18, C.red, 1);
    }
  }

  // ====== Loop ======
  // The touch controls only make sense in-game; parked over a menu they just
  // cover up the keypad and the coin button.
  const padEl = document.getElementById('pad');
  const fireEl = document.getElementById('fire');
  let touchUiShown = null;
  function syncTouchUI() {
    const show = gameState === 'play' || gameState === 'dead' ||
                 gameState === 'win' || gameState === 'bosswin';
    const key = show + '|' + equipped;
    if (key === touchUiShown) return;
    touchUiShown = key;
    padEl.style.display = show ? '' : 'none';
    fireEl.style.display = show ? '' : 'none';
    // The place button only means anything while a Q hat is worn
    const gadget = equipped === 'bow' || equipped === 'space' || equipped === 'boomer';
    throwEl.style.display = (show && gadget) ? '' : 'none';
    throwEl.textContent = equipped === 'space' ? 'HOLE'
                        : equipped === 'boomer' ? 'THROW' : 'BOW';
  }

  let last = performance.now();
  let acc = 0;
  const STEP = 1000 / 60;
  function frame(now) {
    const dt = Math.min(100, now - last);
    last = now;
    acc += dt;
    while (acc >= STEP) {
      update();
      acc -= STEP;
    }
    draw();
    syncTouchUI();
    requestAnimationFrame(frame);
  }

  // Init
  loadProgress();
  makeLevel(1);
  spawnPlayer();
  spawnPDs(1);
  gameState = 'menu';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
