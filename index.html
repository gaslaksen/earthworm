    }
    if (how === 'rock') {
      score += target.type === 'squiggle' ? 250 : target.type === 'ant' ? 350 : 500;
    } else {
      score += target.type === 'squiggle' ? 100 : target.type === 'ant' ? 150 : 200;
    }
    if (byHelper) return;
    const bonus = equipped === 'jester' ? 2 : 1;   // the cap pays double
    const kind = COIN_VALUES[how][target.type] !== undefined ? target.type : 'pd';
    const pay = COIN_VALUES[how][kind] * bonus;
    coins += pay;
    runCoins += pay;
    coinFlash = 24;
    if (target.type === 'squiggle') {
      const slugPay = SLUG_VALUES[how] * bonus;
      slugs += slugPay;
      runSlugs += slugPay;
      slugFlash = 24;
    }
    saveProgress();
  }

  const SAVE_KEY = 'earthworm.save.v1';
  function saveProgress() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        coins, slugs, owned, equipped, cursorsOwned, cursorEquipped,
      }));
    } catch (e) { /* storage blocked - play on without saving */ }
  }
  function loadProgress() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (typeof d.coins === 'number' && isFinite(d.coins)) coins = Math.max(0, d.coins | 0);
      if (typeof d.slugs === 'number' && isFinite(d.slugs)) slugs = Math.max(0, d.slugs | 0);
      if (d.owned && typeof d.owned === 'object') owned = Object.assign({ none: true }, d.owned);
      if (typeof d.equipped === 'string' && owned[d.equipped] && HATS.some(h => h.id === d.equipped)) {
        equipped = d.equipped;
      }
      if (d.cursorsOwned && typeof d.cursorsOwned === 'object') {
        cursorsOwned = Object.assign({ worm: true }, d.cursorsOwned);
      }
      if (typeof d.cursorEquipped === 'string' && cursorsOwned[d.cursorEquipped]
          && CURSORS.some(c => c.id === d.cursorEquipped)) {
        cursorEquipped = d.cursorEquipped;
      }
    } catch (e) { /* missing or corrupt save - start fresh */ }
  }

  // ====== Menu ======
  const MENU_ITEMS = ['PLAY', 'SHOP', 'CURSORS', 'ASM', 'HOW TO PLAY', 'DIFFICULTY'];
  const M_PLAY = 0, M_SHOP = 1, M_CURSORS = 2, M_ASM = 3, M_HOWTO = 4, M_DIFF = 5;
  const DIFF_NAMES = ['EASY', 'NORMAL', 'HARD'];
  let menuIndex = 0;
  let difficulty = 1; // 0=easy 1=normal 2=hard
  // Pixel bounds for tap detection on menu items (set during draw)
  const menuBounds = [];

  function handleMenuKey(key) {
    if (key === 'ArrowUp' || key === 'w' || key === 'W') {
      menuIndex = (menuIndex + MENU_ITEMS.length - 1) % MENU_ITEMS.length;
    } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
      menuIndex = (menuIndex + 1) % MENU_ITEMS.length;
    } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
      if (menuIndex === M_DIFF) difficulty = (difficulty + DIFF_NAMES.length - 1) % DIFF_NAMES.length;
    } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
      if (menuIndex === M_DIFF) difficulty = (difficulty + 1) % DIFF_NAMES.length;
    } else if (key === 'c' || key === 'C') {
      openCodeScreen('coins');
    } else if (key === 'b' || key === 'B') {
      openCodeScreen('boss');
    } else if (key === 'Enter' || key === ' ' || key === 'z' || key === 'Z') {
      activateMenu();
    }
  }

  function activateMenu() {
    if (menuIndex === M_PLAY) startGame();
    else if (menuIndex === M_SHOP) { gameState = 'shop'; shopMsgTimer = 0; }
    else if (menuIndex === M_CURSORS) { gameState = 'cursors'; shopMsgTimer = 0; }
    else if (menuIndex === M_ASM) {
      if (asmLocked()) return;     // the slug is still sulking
      gameState = 'asm';
      asmMsgTimer = 0;
      slugTalk = 0;
      slugPokes = 0;
      slugAngry = 0;
    }
    else if (menuIndex === M_HOWTO) gameState = 'howto';
    else if (menuIndex === M_DIFF) difficulty = (difficulty + 1) % DIFF_NAMES.length;
  }

  // ====== Shop ======
  let shopIndex = 0;
  let shopMsg = '';
  let shopMsgColor = '#ffffff';
  let shopMsgTimer = 0;
  const shopBounds = [];
  const SHOP_ROWS = HATS.length + 1;   // every hat, then BACK
  const SHOP_VISIBLE = 9;              // as many as fit on one screen
  let shopScroll = 0;

  function clampShopScroll() {
    const last = Math.max(0, SHOP_ROWS - SHOP_VISIBLE);
    if (shopIndex < shopScroll) shopScroll = shopIndex;
    else if (shopIndex > shopScroll + SHOP_VISIBLE - 1) {
      shopScroll = shopIndex - SHOP_VISIBLE + 1;
    }
    shopScroll = Math.max(0, Math.min(last, shopScroll));
  }

  function shopMessage(msg, color) {
    shopMsg = msg;
    shopMsgColor = color;
    shopMsgTimer = 120;
  }

  function handleShopKey(key) {
    if (key === 'ArrowUp' || key === 'w' || key === 'W') {
      shopIndex = (shopIndex + SHOP_ROWS - 1) % SHOP_ROWS;
      clampShopScroll();
    } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
      shopIndex = (shopIndex + 1) % SHOP_ROWS;
      clampShopScroll();
    } else if (key === 'Escape' || key === 'Backspace') {
      gameState = 'menu';
    } else if (key === 'Enter' || key === ' ' || key === 'z' || key === 'Z') {
      activateShop();
    }
  }

  function activateShop() {
    if (shopIndex === HATS.length) { gameState = 'menu'; return; }
    const h = HATS[shopIndex];
    if (owned[h.id]) {
      if (equipped === h.id) {
        shopMessage('ALREADY WEARING IT', C.text);
      } else {
        equipped = h.id;
        saveProgress();
        shopMessage(h.id === 'none' ? 'HAT REMOVED' : 'HAT ON!', C.sq1);
      }
    } else if (h.cur === 'unlock') {
      shopMessage(h.id === 'shades' ? 'BEAT THE KING HORNET FIRST'
                : h.id === 'jester' ? 'BEAT THE JESTER ANT FIRST'
                : 'BEAT THE QUEEN MOLE FIRST', C.red);
    } else {
      const purse = h.cur === 'slug' ? slugs : coins;
      if (purse >= h.cost) {
        if (h.cur === 'slug') slugs -= h.cost;
        else coins -= h.cost;
        owned[h.id] = true;
        equipped = h.id;
        saveProgress();
        shopMessage('BOUGHT ' + h.name, C.yellow);
      } else {
        const unit = h.cur === 'slug' ? ' MORE SLUGBUCKS' : ' MORE COINS';
        shopMessage('NEED ' + (h.cost - purse) + unit, C.red);
      }
    }
  }

  function handleShopTap(ev) {
    const [px1, py1] = canvasPoint(ev);
    for (let i = 0; i < shopBounds.length; i++) {
      const b = shopBounds[i];
      if (px1 >= b.x && px1 <= b.x + b.w && py1 >= b.y && py1 <= b.y + b.h) {
        shopIndex = b.idx;
        clampShopScroll();
        activateShop();
        return;
      }
    }
  }

  // ====== Cursor shop ======
  // Same shape as the hat shop, but nothing here changes how the game plays.
  let cursorIndex = 0;
  let cursorScroll = 0;                     // first row shown, for the longer list
  const cursorBounds = [];
  const CURSOR_ROWS = CURSORS.length + 1;   // every pointer, then BACK
  const CURSOR_VISIBLE = 10;                // as many as fit on one screen

  // Keep the highlighted row inside the window, scrolling only when it has to.
  function clampCursorScroll() {
    const last = Math.max(0, CURSOR_ROWS - CURSOR_VISIBLE);
    if (cursorIndex < cursorScroll) cursorScroll = cursorIndex;
    else if (cursorIndex > cursorScroll + CURSOR_VISIBLE - 1) {
      cursorScroll = cursorIndex - CURSOR_VISIBLE + 1;
    }
    cursorScroll = Math.max(0, Math.min(last, cursorScroll));
  }

  function handleCursorKey(key) {
    if (key === 'ArrowUp' || key === 'w' || key === 'W') {
      cursorIndex = (cursorIndex + CURSOR_ROWS - 1) % CURSOR_ROWS;
      clampCursorScroll();
    } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
      cursorIndex = (cursorIndex + 1) % CURSOR_ROWS;
      clampCursorScroll();
    } else if (key === 'Escape' || key === 'Backspace') {
      gameState = 'menu';
    } else if (key === 'Enter' || key === ' ' || key === 'z' || key === 'Z') {
      activateCursorShop();
    }
  }

  function activateCursorShop() {
    if (cursorIndex === CURSORS.length) { gameState = 'menu'; return; }
    const c = CURSORS[cursorIndex];
    if (cursorsOwned[c.id]) {
      if (cursorEquipped === c.id) {
        shopMessage('ALREADY USING IT', C.text);
      } else {
        cursorEquipped = c.id;
        saveProgress();
        shopMessage(c.name + ' IT IS', C.sq1);
      }
    } else {
      const purse = c.cur === 'slug' ? slugs : coins;
      if (purse >= c.cost) {
        if (c.cur === 'slug') slugs -= c.cost;
        else coins -= c.cost;
        cursorsOwned[c.id] = true;
        cursorEquipped = c.id;
        saveProgress();
        shopMessage('BOUGHT ' + c.name, C.yellow);
      } else {
        const unit = c.cur === 'slug' ? ' MORE SLUGBUCKS' : ' MORE COINS';
        shopMessage('NEED ' + (c.cost - purse) + unit, C.red);
      }
    }
  }

  function handleCursorTap(ev) {
    const [px1, py1] = canvasPoint(ev);
    for (let i = 0; i < cursorBounds.length; i++) {
      const b = cursorBounds[i];
      if (px1 >= b.x && px1 <= b.x + b.w && py1 >= b.y && py1 <= b.y + b.h) {
        cursorIndex = b.idx;
        clampCursorScroll();
        activateCursorShop();
        return;
      }
    }
  }

  // ====== Coin machine (code screen) ======
  // The coin button on the title screen asks for a 4 digit code; get it right
  // and you land on a keypad that pays out however many coins you type in.
  const CHEAT_CODE = '2017';
  const KEYPAD_KEYS = [['1','2','3'],['4','5','6'],['7','8','9'],['DEL','0','OK']];
  const coinBtnBounds = { x: 6, y: HUD_H + 4, w: 24, h: 24 };
  const wantedBtnBounds = { x: VW - 34, y: HUD_H + 2, w: 30, h: 28 };
  const menuBtnBounds = { x: 228, y: 0, w: 28, h: HUD_H };
  let codeDest = 'coins';         // what the keypad is guarding this time
  const curBtnBounds = [];          // currency toggle on the payout screen
  let grantCurrency = 'coin';
  const keypadBounds = [];
  const backBtnBounds = { x: 0, y: 0, w: 0, h: 0 };
  let codeEntry = '';
  let coinEntry = '';
  let codeMsg = '';
  let codeMsgColor = '#ffffff';
  let codeMsgTimer = 0;

  function codeMessage(msg, color) {
    codeMsg = msg;
    codeMsgColor = color;
    codeMsgTimer = 150;
  }

  function openCodeScreen(dest) {
    gameState = 'code';
    codeDest = dest || 'coins';
    codeEntry = '';
    coinEntry = '';
    codeMsgTimer = 0;
  }

  function keypadPress(key) {
    if (gameState === 'code') {
      if (key === 'DEL') codeEntry = codeEntry.slice(0, -1);
      else if (key === 'OK') checkCode();
      else if (codeEntry.length < 4) {
        codeEntry += key;
        if (codeEntry.length === 4) checkCode();
      }
    } else if (gameState === 'cheat') {
      if (key === 'DEL') coinEntry = coinEntry.slice(0, -1);
      else if (key === 'OK') grantCoins();
      else if (coinEntry.length < 6) coinEntry += key;
    }
  }

  function checkCode() {
    if (codeEntry === CHEAT_CODE) {
      if (codeDest === 'boss') {
        gameState = 'bosspick';
        bossPickIndex = 0;
      } else {
        gameState = 'cheat';
        coinEntry = '';
      }
      codeMessage('CODE ACCEPTED', C.sq1);
    } else {
      codeMessage('WRONG CODE', C.red);
    }
    codeEntry = '';
  }

  function grantCoins() {
    const n = parseInt(coinEntry, 10);
    if (!coinEntry || !isFinite(n) || n <= 0) {
      codeMessage('TYPE A NUMBER FIRST', C.red);
      return;
    }
    if (grantCurrency === 'slug') {
      slugs = Math.min(99999, slugs + n);
      slugFlash = 60;
      codeMessage('GOT ' + n + ' SLUGBUCKS', C.slug1);
    } else {
      coins = Math.min(999999, coins + n);
      coinFlash = 60;
      codeMessage('GOT ' + n + ' COINS', C.coin1);
    }
    saveProgress();
    coinEntry = '';
  }

  function handleCodeKey(key) {
    if (key === 'Escape') { gameState = 'menu'; return; }
    if (gameState === 'cheat') {
      if (key === 'ArrowLeft' || key === 'ArrowRight' || key === 'Tab') {
        grantCurrency = grantCurrency === 'coin' ? 'slug' : 'coin';
        return;
      }
    }
    if (key === 'Backspace') { keypadPress('DEL'); return; }
    if (key === 'Enter' || key === ' ') { keypadPress('OK'); return; }
    if (/^[0-9]$/.test(key)) keypadPress(key);
  }

  function handleKeypadTap(ev) {
    const [px1, py1] = canvasPoint(ev);
    const b = backBtnBounds;
    if (px1 >= b.x && px1 <= b.x + b.w && py1 >= b.y && py1 <= b.y + b.h) {
      gameState = 'menu';
      return;
    }
    if (gameState === 'cheat') {
      for (const t of curBtnBounds) {
        if (px1 >= t.x && px1 <= t.x + t.w && py1 >= t.y && py1 <= t.y + t.h) {
          grantCurrency = t.cur;
          return;
        }
      }
    }
    for (const k of keypadBounds) {
      if (px1 >= k.x && px1 <= k.x + k.w && py1 >= k.y && py1 <= k.y + k.h) {
        keypadPress(k.key);
        return;
      }
    }
  }

  // ====== Wanted poster: jump straight to a boss ======
  const WANTED = [
    { label: 'KING HORNET', level: KING_LEVEL,   face: 'king' },
    { label: 'QUEEN MOLE',  level: QUEEN_LEVEL,  face: 'queen' },
    { label: 'JESTER ANT',  level: JESTER_LEVEL, face: 'jester' },
    { label: 'KNIGHT BEETLE', level: KNIGHT_LEVEL, face: 'knight' },
  ];
  const bossPickBounds = [];
  let bossPickIndex = 0;

  function startBossFight(lvl) {
    score = 0;
    lives = 3 + (equipped === 'propeller' ? 1 : 0);
    level = lvl;
    runCoins = 0;
    runSlugs = 0;
    beginLevel();
    gameState = 'play';
  }

  function activateBossPick() {
    if (bossPickIndex >= WANTED.length) { gameState = 'menu'; return; }
    startBossFight(WANTED[bossPickIndex].level);
  }

  function handleBossPickKey(key) {
    const rows = WANTED.length + 1;
    if (key === 'Escape' || key === 'Backspace') { gameState = 'menu'; return; }
    if (key === 'ArrowUp' || key === 'w' || key === 'W') {
      bossPickIndex = (bossPickIndex + rows - 1) % rows;
    } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
      bossPickIndex = (bossPickIndex + 1) % rows;
    } else if (key === 'Enter' || key === ' ' || key === 'z' || key === 'Z') {
      activateBossPick();
    }
  }

  function handleBossPickTap(ev) {
    const [px1, py1] = canvasPoint(ev);
    for (const b of bossPickBounds) {
      if (px1 >= b.x && px1 <= b.x + b.w && py1 >= b.y && py1 <= b.y + b.h) {
        bossPickIndex = b.idx;
        activateBossPick();
        return;
      }
    }
  }

  // ====== ASM: the automatic slug machine ======
  // Swaps between the two currencies both ways. The amount buttons always
  // count slugbucks, whichever way the machine is pointing. The machine takes
  // a cut on the way back, so slugbucks stay worth earning.
  const ASM_RATE = 10;       // coins you get for one slugbuck
  const ASM_BUY_RATE = 15;   // coins one slugbuck costs you
  const ASM_AMOUNTS = [1, 5, 10, 'ALL'];
  const ASM_DIRS = 2;
  const ASM_IDX_AMOUNT0 = ASM_DIRS;
  const ASM_IDX_SLUG = ASM_DIRS + ASM_AMOUNTS.length;
  const ASM_IDX_BACK = ASM_IDX_SLUG + 1;
  const ASM_ROWS = ASM_IDX_BACK + 1;
  const SLUG_POS = { x: 115, y: 144, w: 26, h: 16 };
  let asmDir = 'sell';       // 'sell' = bucks to coins, 'buy' = coins to bucks
  const asmBounds = [];
  let asmIndex = 0;
  let asmMsg = '';
  let asmMsgColor = '#ffffff';
  let asmMsgTimer = 0;
  let slugTalk = 0;          // frames the slug's speech bubble stays up

  // He works through these in order, getting shorter-tempered as he goes.
  const SLUG_LINES = [
    'HELLO!',
    'NICE TUNNELS.',
    'SLIMY DAY ISNT IT?',
    'BUSINESS IS SLOW.',
    'I LIKE COINS.',
    'THAT TICKLES.',
    'STOP POKING ME.',
    'I MEAN IT.',
    'LAST WARNING...',
  ];
  const SLUG_ANGRY_LINE = 'THATS IT! GET OUT!';
  const SLUG_LOCK_MS = 30000;      // how long he slams the shutters for
  let slugLine = '';
  let slugPokes = 0;               // pokes so far this visit
  let slugAngry = 0;               // frames of fury before he throws you out
  let asmLockUntil = 0;            // performance.now() deadline

  function asmLocked() {
    return performance.now() < asmLockUntil;
  }
  function asmLockSeconds() {
    return Math.max(1, Math.ceil((asmLockUntil - performance.now()) / 1000));
  }

  function pokeSlug() {
    if (slugAngry > 0) return;     // too late to apologise
    slugPokes++;
    if (slugPokes > SLUG_LINES.length) {
      slugLine = SLUG_ANGRY_LINE;
      slugTalk = 600;
      slugAngry = 70;              // fume for about a second, then boot them
      return;
    }
    slugLine = SLUG_LINES[slugPokes - 1];
    slugTalk = 150;
  }

  function asmMessage(msg, color) {
    asmMsg = msg;
    asmMsgColor = color;
    asmMsgTimer = 150;
  }

  function asmTransfer(which) {
    if (asmDir === 'buy') return asmBuy(which);
    if (slugs <= 0) {
      asmMessage('NO SLUGBUCKS TO TRANSFER', C.red);
      return;
    }
    const amt = which === 'ALL' ? slugs : which;
    if (slugs < amt) {
      asmMessage('ONLY ' + slugs + ' SLUGBUCKS LEFT', C.red);
      return;
    }
    slugs -= amt;
    coins = Math.min(999999, coins + amt * ASM_RATE);
    coinFlash = 60;
    slugFlash = 60;
    saveProgress();
    asmMessage('PAID OUT ' + (amt * ASM_RATE) + ' COINS', C.coin1);
  }

  // Coins back into slugbucks. `which` is how many slugbucks you want.
  function asmBuy(which) {
    const affordable = Math.floor(coins / ASM_BUY_RATE);
    if (affordable <= 0) {
      asmMessage('NEED ' + ASM_BUY_RATE + ' COINS FOR ONE', C.red);
      return;
    }
    const amt = which === 'ALL' ? affordable : which;
    if (amt > affordable) {
      asmMessage('CAN ONLY AFFORD ' + affordable, C.red);
      return;
    }
    coins -= amt * ASM_BUY_RATE;
    slugs = Math.min(99999, slugs + amt);
    coinFlash = 60;
    slugFlash = 60;
    saveProgress();
    asmMessage('BOUGHT ' + amt + ' SLUGBUCKS', C.slug1);
  }

  function activateAsm() {
    if (asmIndex < ASM_DIRS) {
      asmDir = asmIndex === 0 ? 'sell' : 'buy';
      asmMsgTimer = 0;
    } else if (asmIndex < ASM_IDX_SLUG) {
      asmTransfer(ASM_AMOUNTS[asmIndex - ASM_IDX_AMOUNT0]);
    } else if (asmIndex === ASM_IDX_SLUG) {
      pokeSlug();
    } else {
      gameState = 'menu';
    }
  }

  function handleAsmKey(key) {
    if (key === 'Escape' || key === 'Backspace') { gameState = 'menu'; return; }
    if (key === 'ArrowLeft' || key === 'ArrowUp' || key === 'a' || key === 'A' || key === 'w' || key === 'W') {
      asmIndex = (asmIndex + ASM_ROWS - 1) % ASM_ROWS;
    } else if (key === 'ArrowRight' || key === 'ArrowDown' || key === 'd' || key === 'D' || key === 's' || key === 'S') {
      asmIndex = (asmIndex + 1) % ASM_ROWS;
    } else if (key === 'Enter' || key === ' ' || key === 'z' || key === 'Z') {
      activateAsm();
    }
  }

  function handleAsmTap(ev) {
    const [px1, py1] = canvasPoint(ev);
    for (const b of asmBounds) {
      if (px1 >= b.x && px1 <= b.x + b.w && py1 >= b.y && py1 <= b.y + b.h) {
        asmIndex = b.idx;
        activateAsm();
        return;
      }
    }
  }

  // Convert event coords to canvas internal-pixel coords
  function canvasPoint(ev) {
    const rect = canvas.getBoundingClientRect();
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    return [(cx - rect.left) * (VW / rect.width), (cy - rect.top) * (VH / rect.height)];
  }

  function handleMenuTap(ev) {
    const [px, py] = canvasPoint(ev);
    const cb = coinBtnBounds;
    if (px >= cb.x && px <= cb.x + cb.w && py >= cb.y && py <= cb.y + cb.h) {
      openCodeScreen('coins');
      return;
    }
    const wb = wantedBtnBounds;
    if (px >= wb.x && px <= wb.x + wb.w && py >= wb.y && py <= wb.y + wb.h) {
      openCodeScreen('boss');
      return;
    }
    for (let i = 0; i < menuBounds.length; i++) {
      const b = menuBounds[i];
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
        menuIndex = i;
        activateMenu();
        return;
      }
    }
  }

  function startGame() {
    score = 0;
    lives = 3 + (equipped === 'propeller' ? 1 : 0);
    level = 1;
    runCoins = 0;
    runSlugs = 0;
    beginLevel();
    gameState = 'play';
  }

  function beginLevel() {
    makeLevel(level);
    spawnPlayer();
    spawnPDs(level);
    rocks = [];
    mines = [];            // three fresh mines every burrow
    blackHole = null;
    boomerang = null;
    boomCooldown = 0;
    armorFlash = 0;
    helperGoneMsg = 0;
    sporeFlash = 0;
    blastFlash = 0;
    gadgetMsgTimer = 0;
    bossGuardMsg = 0;
    shieldMsg = 0;
    shellLeft = equipped === 'shell' ? 3 : 0;
    shellFlash = 0;
    helper = equipped === 'magic' ? makeHelper() : null;
  }

  // Returns true if the hit was fatal. The knight helm shrugs off rock hits,
  // and the beetle's shell takes three knocks of any kind per burrow.
  function hitPlayer(cause) {
    if (equipped === 'shell' && shellLeft > 0) {
      shellLeft--;
      player.invuln = 110;
      shellFlash = 50;
      if (cause === 'squish') escapeRock();
      return false;
    }
    if (cause === 'squish' && equipped === 'armor') {
      player.invuln = 90;
      armorFlash = 50;
      escapeRock();
      return false;
    }
    player.alive = false;
    loseLife(cause);
    return true;
  }

  // ====== Gadgets you plant with Q ======
  // Only one hat is worn at a time, so Q means whatever your hat means.
  const MINE_MAX = 3;              // three mines per burrow, then you are out
  const MINE_ARM = 20;             // frames before a fresh mine is live
  const HOLE_PULL = TILE * 3;      // how far the black hole reaches
  let mines = [];
  let blackHole = null;

  function placeGadget() {
    if (gameState !== 'play' || !player.alive) return;
    if (equipped === 'bow') plantMine();
    else if (equipped === 'space') dropBlackHole();
    else if (equipped === 'boomer') throwBoomerang();
  }

  // ====== The boomerang ======
  // Flies out the way you are facing, scything through minions, then curves
  // back to your hand. One in the air at a time.
  const BOOM_SPEED = 3.4;
  const BOOM_REACH = TILE * 5;     // how far out before it turns round
  const BOOM_COOLDOWN = 24;        // breath between catching it and the next throw
  let boomerang = null;
  let boomCooldown = 0;

  function throwBoomerang() {
    if (boomerang || boomCooldown > 0) return;
    const dx = player.dir === 'L' ? -1 : player.dir === 'R' ? 1 : 0;
    const dy = player.dir === 'U' ? -1 : player.dir === 'D' ? 1 : 0;
    boomerang = {
      x: player.x + 4, y: player.y + 4,
      dx, dy,
      out: 0,                      // distance travelled on the way out
      back: false,
      spin: 0,
      hit: new Set(),              // one boss can only be clipped once per throw
    };
  }

  function updateBoomerang() {
    if (boomCooldown > 0) boomCooldown--;
    if (!boomerang) return;
    const b = boomerang;
    b.spin += 0.55;

    if (!b.back) {
      b.x += b.dx * BOOM_SPEED;
      b.y += b.dy * BOOM_SPEED;
      b.out += BOOM_SPEED;
      // Turn round at full stretch, or at the edge of the burrow
      const edge = b.x < -8 || b.y < -8 || b.x > COLS * TILE || b.y > PLAY_H;
      if (b.out >= BOOM_REACH || edge) b.back = true;
    } else {
      // Home in on the worm, wherever it has got to
      const tx = player.x + 4, ty = player.y + 4;
      const vx = tx - b.x, vy = ty - b.y;
      const d = Math.hypot(vx, vy) || 1;
      b.x += (vx / d) * BOOM_SPEED;
      b.y += (vy / d) * BOOM_SPEED;
      if (d < 8) {                 // caught
        boomerang = null;
        boomCooldown = BOOM_COOLDOWN;
        return;
      }
    }

    // Anything it touches on the way
    const cx = b.x + 4, cy = b.y + 4;
    for (const e of pds) {
      if (!e.alive) continue;
      const reach = isBoss(e) ? 20 : 11;
      if (Math.abs(entCX(e) - cx) >= reach || Math.abs(entCY(e) - cy) >= reach) continue;
      if (isBoss(e)) {
        if (b.hit.has(e)) continue;   // only one bite out of a boss per throw
        b.hit.add(e);
        e.hp--;
        e.lash = 0;
        e.hurtFlash = 36;
        e.stunned = 30;
        if (e.hp <= 0) {
          e.alive = false;
          awardKill(e, 'pop', false);
        }
      } else {
        e.alive = false;
        awardKill(e, 'pop', false);
      }
    }
  }

  function drawBoomerang() {
    if (!boomerang) return;
    const sx = boomerang.x | 0, sy = (boomerang.y + HUD_H) | 0;
    // An L of wood tumbling through four quarter turns - the corner moves
    // round the box, so it reads as spinning rather than as a cross.
    const f = Math.floor(boomerang.spin) % 4;
    const armY = (f === 0 || f === 1) ? sy : sy + 4;
    const armX = (f === 0 || f === 3) ? sx : sx + 4;
    rect(sx, armY, 6, 2, C.antD);
    rect(armX, sy, 2, 6, C.antD);
    rect(sx, armY, 5, 1, C.pdBel);
    rect(armX, sy, 1, 5, C.pdBel);
  }

  function sayGadget(msg) {
    gadgetMsg = msg;
    gadgetMsgTimer = 90;
  }

  // A third of a boss's full health, rounded up, and never less than one.
  function bossChunk(b) {
    b.hp -= Math.max(1, Math.ceil(b.maxHp / 3));
    b.lash = 0;
    b.hurtFlash = 36;
    b.stunned = 40;
    if (b.hp <= 0) {
      b.alive = false;
      awardKill(b, 'pop', false);
    }
  }

  function plantMine() {
    if (mines.length >= MINE_MAX) { sayGadget('NO BOWS LEFT'); return; }
    mines.push({
      x: Math.round(player.x / TILE) * TILE,
      y: Math.round(player.y / TILE) * TILE,
      arm: MINE_ARM,
      blink: 0,
    });
  }

  function updateMines() {
    for (let i = mines.length - 1; i >= 0; i--) {
      const m = mines[i];
      m.blink++;
      if (m.arm > 0) { m.arm--; continue; }
      const cx = m.x + 8, cy = m.y + 8;
      for (const e of pds) {
        if (!e.alive) continue;
        const reach = isBoss(e) ? 20 : 11;
        if (Math.abs(entCX(e) - cx) >= reach || Math.abs(entCY(e) - cy) >= reach) continue;
        blastFlash = 20;
        blastAt = { x: cx, y: cy };
        if (isBoss(e)) bossChunk(e);
        else { e.alive = false; awardKill(e, 'pop', false); }
        mines.splice(i, 1);        // it goes up with whatever stood on it
        break;
      }
    }
  }

  function dropBlackHole() {
    // Only ever one - dropping a new one closes the last
    blackHole = {
      x: Math.round(player.x / TILE) * TILE + 8,
      y: Math.round(player.y / TILE) * TILE + 8,
      spin: 0,
      hit: new Set(),              // one bite out of each boss per hole
    };
  }

  function updateBlackHole() {
    if (!blackHole) return;
    const h = blackHole;
    h.spin += 0.22;
    for (const e of pds) {
      if (!e.alive) continue;
      const dx = h.x - entCX(e), dy = h.y - entCY(e);
      const d = Math.hypot(dx, dy);
      if (d > HOLE_PULL) continue;
      if (isBoss(e)) {
        // Far too big to be dragged in, but the pull still tears a chunk off
        if (!h.hit.has(e)) { h.hit.add(e); bossChunk(e); }
        continue;
      }
      e.x += (dx / (d || 1)) * 0.9;
      e.y += (dy / (d || 1)) * 0.9;
      e.stunned = Math.max(e.stunned, 4);
      if (d < 7) { e.alive = false; awardKill(e, 'pop', false); }
    }
  }

  function drawMines() {
    for (const m of mines) {
      // Her bow, sitting in the dirt waiting to be trodden on. It flickers
      // while it settles, then holds steady once it is live.
      if (m.arm > 0 && (m.blink % 8) < 4) continue;
      const sx = m.x + 4, sy = m.y + 5 + HUD_H;
      rect(sx,     sy + 1, 3, 5, C.red);
      rect(sx + 5, sy + 1, 3, 5, C.red);
      rect(sx,     sy + 2, 3, 3, C.bowL);
      rect(sx + 5, sy + 2, 3, 3, C.bowL);
      rect(sx + 3, sy + 1, 2, 5, C.bowD);
    }
  }

  function drawBlackHole() {
    if (!blackHole) return;
    const cx = blackHole.x | 0, cy = (blackHole.y + HUD_H) | 0;
    // A dark well with a ring of light turning round it
    rect(cx - 6, cy - 4, 12, 8, C.magic2);
    rect(cx - 4, cy - 6, 8, 12, C.magic2);
    rect(cx - 4, cy - 3, 8, 6, C.tunnel);
    rect(cx - 3, cy - 4, 6, 8, C.tunnel);
    for (let i = 0; i < 4; i++) {
      const a = blackHole.spin + i * (Math.PI / 2);
      px(Math.round(cx + Math.cos(a) * 6), Math.round(cy + Math.sin(a) * 5), C.magic1);
      px(Math.round(cx + Math.cos(a + 0.5) * 7), Math.round(cy + Math.sin(a + 0.5) * 6), C.help1);
    }
  }

  // Shove the worm clear of a falling rock so the landed rock can't entomb it.
  function escapeRock() {
    const ax = Math.round(player.x / TILE) * TILE;
    const ay = Math.round(player.y / TILE) * TILE;
    const tries = [[-TILE,0],[TILE,0],[0,-TILE],[0,TILE],[-TILE*2,0],[TILE*2,0]];
    for (const [dx, dy] of tries) {
      const nx = ax + dx, ny = ay + dy;
      if (canOccupy(nx, ny)) {
        player.x = nx;
        player.y = ny;
        carveAt(nx, ny);
        return;
      }
    }
    player.x = ax;
    player.y = ay;
  }

  function loseLife(cause) {
    deathCause = cause || 'chomp';
    lives--;
    if (lives <= 0) {
      gameState = 'over';
      stateTimer = 0;
    } else {
      gameState = 'dead';
      stateTimer = 0;
    }
  }

  function nextLevel() {
    if (level >= KNIGHT_LEVEL) {
      if (!owned.shell) {
        owned.shell = true;
        saveProgress();
      }
      gameState = 'beat';
      stateTimer = 0;
      return;
    }
    const prize = level === KING_LEVEL ? 'shades'
                : level === QUEEN_LEVEL ? 'bow'
                : level === JESTER_LEVEL ? 'jester' : null;
    if (prize) {
      if (!owned[prize]) {
        owned[prize] = true;
        saveProgress();
      }
      bossWin = prize === 'shades'
        ? { title: 'THE KING FALLS', prize: 'YOU TOOK HIS SHADES' }
        : prize === 'jester'
        ? { title: 'THE JESTER FALLS', prize: 'HIS CAP IS YOURS' }
        : { title: 'THE QUEEN FALLS', prize: 'THE BOW IS YOURS' };
      level++;
      gameState = 'bosswin';
      stateTimer = 0;
      return;
    }
    level++;
    gameState = 'win';
    stateTimer = 0;
  }

  // ====== Update ======
  function update() {
    if (coinFlash > 0) coinFlash--;
    if (slugFlash > 0) slugFlash--;
    if (armorFlash > 0) armorFlash--;
    if (gadgetMsgTimer > 0) gadgetMsgTimer--;
    if (helperGoneMsg > 0) helperGoneMsg--;
    if (sporeFlash > 0) sporeFlash--;
    if (blastFlash > 0) blastFlash--;
    if (bossGuardMsg > 0) bossGuardMsg--;
    if (shieldMsg > 0) shieldMsg--;
    if (shellFlash > 0) shellFlash--;
    if (shopMsgTimer > 0) shopMsgTimer--;
    if (codeMsgTimer > 0) codeMsgTimer--;
    if (asmMsgTimer > 0) asmMsgTimer--;
    if (slugTalk > 0) slugTalk--;
    if (slugAngry > 0) {
      slugAngry--;
      if (slugAngry === 0) {
        if (gameState === 'asm') gameState = 'menu';
        asmLockUntil = performance.now() + SLUG_LOCK_MS;
        slugPokes = 0;
        slugTalk = 0;
      }
    }
    if (gameState === 'play') {
      updatePlayer();
      updateMines();
      updateBlackHole();
      updateBoomerang();
      updateHelper();
      updatePDs();
      updateRocks();
      // Win? On her floor only she matters - the court keeps coming.
      const boss = pds.find(isBoss);
      if (boss ? !boss.alive : pds.every(p => !p.alive)) nextLevel();
    } else {
      stateTimer++;
      if (gameState === 'dead' && stateTimer > 90) {
        beginLevel();
        gameState = 'play';
      } else if (gameState === 'win' && stateTimer > 90) {
        beginLevel();
        gameState = 'play';
      } else if (gameState === 'bosswin' && stateTimer > 210) {
        beginLevel();
        gameState = 'play';
      } else if (gameState === 'over' && stateTimer > 180) {
        // wait for input
      }
    }
  }

  function updatePlayer() {
    if (!player.alive) return;
    if (player.invuln > 0) player.invuln--;

    // Squirt attack
    if (pressed('F')) {
      tryStartSquirt();
    } else {
      if (player.squirting) {
        // Releasing lets the target deflate - and a boss forget his swing
        releaseSquirt(player);
      }
    }

    if (player.squirting) {
      player.squirtTimer++;
      const tgt = player.squirtTarget;
      if (tgt && tgt.alive && (isBoss(tgt) || tileAt(tgt.x+8, tgt.y+8) === EMPTY)) {
        // Inflate over time.
        const fast = false;
        // His shield is on the side he faces - get round the back of him
        if (tgt.type === 'knight' && !behindKnight(tgt)) {
          if (shieldMsg <= 0) shieldMsg = 70;
          tgt.pumped = 0;
        } else if (player.squirtTimer % (fast ? 1 : 18) === 0) {
          tgt.pumped += fast ? 4 : 1;
          tgt.pumpDecay = 60;
          const popAt = equipped === 'party' ? 3 : 4;   // party hat pops them early
          if (tgt.pumped >= popAt && inflateHit(tgt, false)) {
            player.squirting = false;
            player.squirtTarget = null;
            player.squirtTimer = 0;
            return;
          }
        }
        // Bosses hit back while you inflate them, so you cannot just stand
        // there and pump. Let go when he rears up, then grab him again.
        if (isBoss(tgt)) {
          tgt.lash++;
          if (tgt.lash >= lashLimit(tgt)) {
            releaseSquirt(player);
            tgt.lash = 0;
            if (player.invuln <= 0) {
              hitPlayer(tgt.type);
              return;
            }
          }
        }
        // Rocks still squish while squirting
        for (const r of rocks) {
          if (r.landed || player.invuln > 0) continue;
          if (Math.abs(r.x - player.x) < 12 && Math.abs(r.y - player.y) < 12) {
            hitPlayer('squish');
            return;
          }
        }
        // Cannot move while squirting
        return;
      } else {
        releaseSquirt(player);
      }
    }

    // Movement (axis-locked, snap to perpendicular axis when turning)
    let dx = 0, dy = 0;
    if (pressed('L')) { dx = -1; player.dir = 'L'; }
    else if (pressed('R')) { dx = 1; player.dir = 'R'; }
    else if (pressed('U')) { dy = -1; player.dir = 'U'; }
    else if (pressed('D')) { dy = 1; player.dir = 'D'; }

    if (dx !== 0 || dy !== 0) {
      // Snap to grid on perpendicular axis
      if (dx !== 0) player.y = Math.round(player.y / TILE) * TILE;
      if (dy !== 0) player.x = Math.round(player.x / TILE) * TILE;

      const nx = player.x + dx * player.speed;
      const ny = player.y + dy * player.speed;
      if (canOccupy(nx, ny)) {
        player.x = nx;
        player.y = ny;
        carveAt(player.x, player.y);
        // Trail
        const head = { x: player.x + 8, y: player.y + 8 };
        const last = player.bodyTrail[0];
        if (!last || Math.hypot(head.x - last.x, head.y - last.y) > 3) {
          player.bodyTrail.unshift(head);
          if (player.bodyTrail.length > 6) player.bodyTrail.pop();
        }
      }
    }

    // Collide with rocks (falling) or PDs
    for (const p of pds) {
      if (!p.alive) continue;
      const reach = isBoss(p) ? 20 : 12;
      if (Math.abs(entCX(p) - (player.x + 8)) < reach &&
          Math.abs(entCY(p) - (player.y + 8)) < reach) {
        if (player.invuln <= 0 && p.pumped < 3) {
          hitPlayer(p.type === 'squiggle' ? 'tangle'
                  : p.type === 'ant' ? 'ant'
                  : p.type === 'queen' ? 'queen'
                  : p.type === 'king' ? 'king'
                  : p.type === 'jester' ? 'jester' : 'chomp');
          return;
        }
      }
    }
    for (const r of rocks) {
      if (r.landed || player.invuln > 0) continue;
      if (Math.abs(r.x - player.x) < 12 && Math.abs(r.y - player.y) < 12) {
        hitPlayer('squish');
        return;
      }
    }
  }

  function tryStartSquirt() {
    if (!player.alive) return;
    const target = findSquirtTarget(player);
    if (target) {
      player.squirting = true;
      player.squirtTarget = target;
    }
  }

  // Let go of whatever is on the end of the ink. A boss resets his wind-up.
  function releaseSquirt(ent) {
    if (ent.squirtTarget && isBoss(ent.squirtTarget)) ent.squirtTarget.lash = 0;
    ent.squirting = false;
    ent.squirtTimer = 0;
    ent.squirtTarget = null;
  }

  // Nearest live enemy lined up in front of `ent`, within about two tiles.
  function findSquirtTarget(ent) {
    let dx = 0, dy = 0;
    if (ent.dir === 'L') dx = -1;
    else if (ent.dir === 'R') dx = 1;
    else if (ent.dir === 'U') dy = -1;
    else dy = 1;

    const cx = ent.x + 8;
    const cy = ent.y + 8;
    let target = null;
    let bestDist = 1e9;
    for (const p of pds) {
      if (!p.alive) continue;
      const half = entHalf(p);
      const px = entCX(p);
      const py = entCY(p);
      // The cowboy hat lets the ink carry a good tile and a half further
      const span = equipped === 'cowboy' ? 3.7 : 2.2;
      const reach = TILE * span + (half - 8);  // measure to her edge, not her middle
      // Must be aligned on the axis of travel
      if (dx !== 0 && Math.abs(py - cy) < half && Math.sign(px - cx) === dx) {
        const d = Math.abs(px - cx);
        if (d < reach && d < bestDist) { bestDist = d; target = p; }
      } else if (dy !== 0 && Math.abs(px - cx) < half && Math.sign(py - cy) === dy) {
        const d = Math.abs(py - cy);
        if (d < reach && d < bestDist) { bestDist = d; target = p; }
      }
    }
    return target;
  }

  // ====== Helper worm (magic hat) ======
  // A conjured second worm that hunts enemies on its own. It is slower than
  // you, slower to pop things, and it has three lives of its own - run them
  // out and it is gone for the rest of the burrow. Its pops score points but
  // pay no coins.
  const HELPER_LIVES = 3;
  let helper = null;

  function makeHelper() {
    return {
      x: TILE, y: 0,
      dir: 'R',
      speed: 0.8,
      lives: HELPER_LIVES,
      invuln: 0,
      squirting: false,
      squirtTimer: 0,
      squirtTarget: null,
      bodyTrail: [],
      repathTimer: 0,
    };
  }

  // One knock costs it a life and sends it back to the mouth of the burrow.
  function hurtHelper() {
    helper.lives--;
    if (helper.lives <= 0) {
      helper = null;
      helperGoneMsg = 110;
      return;
    }
    helper.x = TILE;
    helper.y = 0;
    helper.dir = 'R';
    helper.invuln = 90;
    helper.squirting = false;
    helper.squirtTarget = null;
    helper.squirtTimer = 0;
    helper.bodyTrail.length = 0;
    carveAt(helper.x, helper.y);
  }

  function helperCanGo(dir) {
    const ax = Math.round(helper.x / TILE) * TILE;
    const ay = Math.round(helper.y / TILE) * TILE;
    const dx = dir === 'L' ? -1 : dir === 'R' ? 1 : 0;
    const dy = dir === 'U' ? -1 : dir === 'D' ? 1 : 0;
    return canOccupy(ax + dx * TILE, ay + dy * TILE);
  }

  function updateHelper() {
    if (!helper) return;

    // It can be caught now, same as you can
    if (helper.invuln > 0) {
      helper.invuln--;
    } else {
      for (const p of pds) {
        if (!p.alive || p.pumped >= 3) continue;
        const reach = isBoss(p) ? 20 : 12;
        if (Math.abs(entCX(p) - (helper.x + 8)) < reach &&
            Math.abs(entCY(p) - (helper.y + 8)) < reach) { hurtHelper(); return; }
      }
      for (const r of rocks) {
        if (r.landed) continue;
        if (Math.abs(r.x - helper.x) < 12 && Math.abs(r.y - helper.y) < 12) {
          hurtHelper();
          return;
        }
      }
    }

    // Keep pumping whatever it locked onto
    if (helper.squirting) {
      const tgt = helper.squirtTarget;
      if (tgt && tgt.alive && (isBoss(tgt) || tileAt(tgt.x + 8, tgt.y + 8) === EMPTY)) {
        helper.squirtTimer++;
        if (helper.squirtTimer % 30 === 0) {    // slower on the pump than you
          tgt.pumped++;
          tgt.pumpDecay = 60;
          if (tgt.pumped >= 4 && inflateHit(tgt, true)) {
            helper.squirting = false;
            helper.squirtTarget = null;
            helper.squirtTimer = 0;
          }
        }
        return;
      }
      helper.squirting = false;
      helper.squirtTarget = null;
      helper.squirtTimer = 0;
    }

    const lined = findSquirtTarget(helper);
    if (lined) {
      helper.squirting = true;
      helper.squirtTarget = lined;
      helper.squirtTimer = 0;
      return;
    }

    // Chase the nearest live enemy, closing the bigger gap first
    let goal = null, bestDist = 1e9;
    for (const p of pds) {
      if (!p.alive) continue;
      const d = Math.hypot(p.x - helper.x, p.y - helper.y);
      if (d < bestDist) { bestDist = d; goal = p; }
    }
    if (!goal) return;

    helper.repathTimer--;
    const ax = Math.round(helper.x / TILE) * TILE;
    const ay = Math.round(helper.y / TILE) * TILE;
    const aligned = Math.abs(helper.x - ax) < 0.6 && Math.abs(helper.y - ay) < 0.6;
    if (aligned && helper.repathTimer <= 0) {
      helper.repathTimer = 12;
      const dxp = goal.x - helper.x;
      const dyp = goal.y - helper.y;
      const order = Math.abs(dxp) > Math.abs(dyp)
        ? [dxp > 0 ? 'R' : 'L', dyp > 0 ? 'D' : 'U']
        : [dyp > 0 ? 'D' : 'U', dxp > 0 ? 'R' : 'L'];
      const open = ['L','R','U','D'].filter(helperCanGo);
      const pick = order.find(d => open.includes(d));
      if (pick) helper.dir = pick;
      else if (open.length) helper.dir = open[(Math.random() * open.length) | 0];
    }

    let dx = 0, dy = 0;
    if (helper.dir === 'L') dx = -1;
    else if (helper.dir === 'R') dx = 1;
    else if (helper.dir === 'U') dy = -1;
    else dy = 1;
    if (dx !== 0) helper.y = ay;
    if (dy !== 0) helper.x = ax;

    const digging = tileAt(helper.x + 8, helper.y + 8) === DIRT;
    const s = digging ? helper.speed * 0.6 : helper.speed;
    const nx = helper.x + dx * s;
    const ny = helper.y + dy * s;
    if (canOccupy(nx, ny)) {
      helper.x = nx;
      helper.y = ny;
      carveAt(helper.x, helper.y);
      const head = { x: helper.x + 8, y: helper.y + 8 };
      const last = helper.bodyTrail[0];
      if (!last || Math.hypot(head.x - last.x, head.y - last.y) > 3) {
        helper.bodyTrail.unshift(head);
        if (helper.bodyTrail.length > 6) helper.bodyTrail.pop();
      }
    } else {
      helper.x = ax;       // back onto the grid, or it jams against the rock
      helper.y = ay;
      helper.repathTimer = 0;
    }
  }

  function updatePDs() {
    for (const p of pds) {
      if (!p.alive) continue;
      if (p.hurtFlash > 0) p.hurtFlash--;
      // Decay pump pressure
      if (p.pumped > 0) {
        if (p.pumpDecay > 0) p.pumpDecay--;
        else { p.pumped--; p.pumpDecay = 60; }
      }
      // While being pumped, stay put
      if (p === player.squirtTarget && player.squirting) continue;
      // Stunned by pumping for a moment after release
      if (p.pumped >= 2) { p.stunned = Math.max(p.stunned, 30); }
      if (p.stunned > 0) { p.stunned--; continue; }
      if (p.type === 'queen') { moveQueen(p); continue; }
      if (p.type === 'king') { moveKing(p); continue; }
      if (p.type === 'jester') { moveJester(p); continue; }
      if (p.type === 'knight') { moveKnight(p); continue; }

      // Decide direction
      p.thinkTimer--;
      const ax = Math.round(p.x / TILE) * TILE;
      const ay = Math.round(p.y / TILE) * TILE;
      const aligned = Math.abs(p.x - ax) < 0.5 && Math.abs(p.y - ay) < 0.5;

      if (aligned && p.thinkTimer <= 0) {
        p.thinkTimer = 20 + ((Math.random()*30)|0);
        const tunnelChoices = [];
        const dirtChoices = [];
        const dirs = [['L',-1,0],['R',1,0],['U',0,-1],['D',0,1]];
        for (const [d, dx, dy] of dirs) {
          const nx = p.x + dx * TILE;
          const ny = p.y + dy * TILE;
          if (nx < 0 || ny < 0 || nx + TILE > COLS*TILE || ny + TILE > PLAY_H) continue;
          const t = tileAt(nx+8, ny+8);
          if (t === ROCK || t === FALLING) continue;
          if (t === EMPTY) tunnelChoices.push(d);
          else if (t === DIRT) dirtChoices.push(d);
        }
        // Prefer existing tunnels; fall back to digging through dirt
        const choices = tunnelChoices.length ? tunnelChoices : dirtChoices;
        if (choices.length) {
          // Bias toward player
          const dxp = (player.x - p.x);
          const dyp = (player.y - p.y);
          let pref;
          if (Math.abs(dxp) > Math.abs(dyp)) pref = dxp > 0 ? 'R' : 'L';
          else pref = dyp > 0 ? 'D' : 'U';
          const hunts = equipped !== 'shades';   // too cool to be noticed
          if (hunts && choices.includes(pref) && Math.random() < 0.7) p.dir = pref;
          else p.dir = choices[(Math.random()*choices.length)|0];
        }
      }

      // Move (slower while digging through dirt)
      const tHere = tileAt(p.x + 8, p.y + 8);
      const digging = tHere === DIRT;
      const s = digging ? p.speed * 0.5 : p.speed;
      let dx = 0, dy = 0;
      if (p.dir === 'L') dx = -1;
      else if (p.dir === 'R') dx = 1;
      else if (p.dir === 'U') dy = -1;
      else if (p.dir === 'D') dy = 1;
      const nx = p.x + dx * s;
      const ny = p.y + dy * s;
      if (nx >= 0 && ny >= 0 && nx + TILE <= COLS*TILE && ny + TILE <= PLAY_H) {
        const t = tileAt(nx+8, ny+8);
        if (t === EMPTY || t === DIRT) {
          p.x = nx;
          p.y = ny;
          if (t === DIRT) carveAt(p.x, p.y);
          if (p.type === 'squiggle') p.wiggle += 0.4;
        } else {
          // Bumped something solid. Snap back onto the grid before re-thinking,
          // or `aligned` never comes true again and it pushes at the rock forever.
          p.x = ax;
          p.y = ay;
          p.thinkTimer = 0;
        }
      } else {
        // Same snap as the bump above: at the burrow wall it would otherwise
        // sit off-grid and never re-think. The black hole can drag it here.
        p.x = ax;
        p.y = ay;
        p.thinkTimer = 0;
      }
    }
  }

  function updateRocks() {
    // Detect dirt-supported rocks vs falling
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === ROCK) {
          // If tile below is empty, start wobble then fall
          const below = r + 1 < ROWS ? grid[r+1][c] : DIRT;
          if (below === EMPTY) {
            // Convert into falling rock object
            grid[r][c] = EMPTY;
            rocks.push({
              x: c * TILE,
              y: r * TILE,
              vy: 0,
              wobble: 30,
              landed: false,
            });
          }
        }
      }
    }
    for (const rk of rocks) {
      if (rk.landed) continue;
      if (rk.wobble > 0) { rk.wobble--; continue; }
      rk.vy += 0.25;
      rk.y += rk.vy;
      // Hit a wall (dirt) below or ground?
      const cx = rk.x + 8;
      const by = rk.y + TILE;
      if (by >= PLAY_H) {
        rk.y = PLAY_H - TILE;
        rk.landed = true;
        continue;
      }
      const t = tileAt(cx, by);
      if (t === DIRT || t === ROCK) {
        // Snap to grid above
        rk.y = (Math.floor((by) / TILE) - 1) * TILE;
        rk.landed = true;
        // Re-embed as a static rock so the dirt system can re-check next time it's exposed
        const r2 = Math.floor((rk.y) / TILE);
        const c2 = Math.floor((rk.x) / TILE);
        setTile(r2, c2, ROCK);
      }
      // Kill enemies in the path
      for (const p of pds) {
        if (!p.alive) continue;
        const reach = isBoss(p) ? 22 : 12;
        if (Math.abs(entCX(p) - (rk.x + 8)) >= reach ||
            Math.abs(entCY(p) - (rk.y + 8)) >= reach) continue;
        if (isBoss(p)) {
          // Too big to squash. Ink is the only thing that works on them.
          if (bossGuardMsg <= 0) bossGuardMsg = 110;
        } else {
          p.alive = false;
          awardKill(p, 'rock', false);
        }
      }
    }
    // Remove rocks that became static
    rocks = rocks.filter(rk => !rk.landed || true); // keep around briefly for draw
    // Simpler: drop landed
    rocks = rocks.filter(rk => !rk.landed);
  }

  // ====== Drawing ======
  function px(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x|0, y|0, 1, 1);
  }
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x|0, y|0, w|0, h|0);
  }

  function drawDirtTile(c, r) {
    const x = c * TILE;
    const y = r * TILE + HUD_H;
    rect(x, y, TILE, TILE, C.dirt2);
    // crosshatch
    ctx.fillStyle = C.dirt1;
    const seed = dirtSeed[r][c];
    for (let i = 0; i < 6; i++) {
      const px1 = x + ((i * 5 + seed * 3) % TILE);
      const py1 = y + ((i * 7 + seed * 5) % TILE);
      ctx.fillRect(px1, py1, 2, 1);
    }
    ctx.fillStyle = C.dirt3;
    for (let i = 0; i < 4; i++) {
      const px1 = x + ((i * 3 + seed * 4 + 5) % TILE);
      const py1 = y + ((i * 11 + seed * 2 + 3) % TILE);
      ctx.fillRect(px1, py1, 1, 1);
    }
  }

  function drawTunnelTile(c, r) {
    const x = c * TILE;
    const y = r * TILE + HUD_H;
    rect(x, y, TILE, TILE, C.tunnel);
    // Slight texture
    ctx.fillStyle = '#3a1c0a';
    ctx.fillRect(x+2, y+3, 1, 1);
    ctx.fillRect(x+10, y+9, 1, 1);
    ctx.fillRect(x+6, y+13, 1, 1);
  }

  function drawRockTile(c, r) {
    const x = c * TILE;
    const y = r * TILE + HUD_H;
    drawRockAt(x, y);
  }

  function drawRockAt(x, y) {
    rect(x+2, y+2, 12, 12, C.rock2);
    rect(x+3, y+3, 10, 10, C.rock1);
    // shading
    rect(x+10, y+3, 3, 10, C.rock2);
    rect(x+3, y+11, 10, 2, C.rock2);
    // outline
    rect(x+2, y+1, 12, 1, C.rockD);
    rect(x+1, y+2, 1, 12, C.rockD);
    rect(x+14, y+2, 1, 12, C.rockD);
    rect(x+2, y+14, 12, 1, C.rockD);
  }

  // Worm sprite at (x, y) facing dir. c1 = bright, c2 = shadow.
  function drawWorm(x, y, dir, trail, c1, c2) {
    // Body trail (segments behind the head)
    ctx.fillStyle = c2;
    for (let i = 0; i < trail.length; i++) {
      const seg = trail[i];
      const tx = seg.x - 3;
      const ty = seg.y - 3 + HUD_H;
      ctx.fillRect(tx, ty, 6, 6);
      ctx.fillStyle = c1;
      ctx.fillRect(tx+1, ty+1, 4, 4);
      ctx.fillStyle = c2;
    }

    // Head sprite (16x16)
    const sx = x|0, sy = (y + HUD_H)|0;
    // base body oval
    rect(sx+3, sy+5, 10, 7, c2);
    rect(sx+4, sy+4, 8, 9, c2);
    rect(sx+5, sy+5, 6, 7, c1);
    rect(sx+4, sy+6, 8, 5, c1);
    // Head bump in direction of travel
    if (dir === 'R') {
      rect(sx+12, sy+6, 3, 5, c2);
      rect(sx+13, sy+7, 2, 3, c1);
      px(sx+12, sy+7, C.wormE); // eye
    } else if (dir === 'L') {
      rect(sx+1, sy+6, 3, 5, c2);
      rect(sx+1, sy+7, 2, 3, c1);
      px(sx+3, sy+7, C.wormE);
    } else if (dir === 'U') {
      rect(sx+6, sy+1, 5, 3, c2);
      rect(sx+7, sy+1, 3, 2, c1);
      px(sx+7, sy+3, C.wormE);
    } else {
      rect(sx+6, sy+12, 5, 3, c2);
      rect(sx+7, sy+13, 3, 2, c1);
      px(sx+8, sy+12, C.wormE);
    }
    // Segment lines
    ctx.fillStyle = c2;
    ctx.fillRect(sx+5, sy+8, 6, 1);
    ctx.fillRect(sx+7, sy+5, 1, 6);
  }

  // ====== Hats ======
  // 8x7-ish hat with its top-left at (hx, hy). Also used for the shop rows.
  function drawHat(hx, hy, id) {
    if (id === 'armor') {
      rect(hx+3, hy-1, 2, 2, C.red);        // plume
      rect(hx, hy+2, 8, 4, C.steelD);
      rect(hx+1, hy+1, 6, 4, C.steel);
      rect(hx+1, hy+4, 6, 1, C.steelD);     // visor slit
    } else if (id === 'magic') {
      rect(hx+2, hy-1, 4, 5, C.magic1);     // top hat crown
      rect(hx+5, hy-1, 1, 5, C.magic2);     // shaded side
      rect(hx+2, hy+2, 4, 1, C.yellow);     // hat band
      rect(hx, hy+4, 8, 1, C.magic1);       // brim
      rect(hx, hy+5, 8, 1, C.magic2);
    } else if (id === 'slugcrown') {
      rect(hx+1, hy+3, 6, 3, C.slug2);      // band
      rect(hx+1, hy+3, 6, 1, C.slug1);
      rect(hx+1, hy+1, 1, 2, C.slug1);      // three points
      rect(hx+3, hy,   2, 3, C.slug1);
      rect(hx+6, hy+1, 1, 2, C.slug1);
      px(hx+3, hy+4, C.yellow);             // jewel
    } else if (id === 'bow') {
      rect(hx,   hy+1, 3, 5, C.red);
      rect(hx+5, hy+1, 3, 5, C.red);
      rect(hx,   hy+2, 3, 3, C.bowL);
      rect(hx+5, hy+2, 3, 3, C.bowL);
      rect(hx+3, hy+1, 2, 5, C.bowD);
    } else if (id === 'boomer') {
      rect(hx+1, hy+1, 6, 2, C.antD);       // a bent arm of pale wood
      rect(hx+1, hy+1, 2, 5, C.antD);
      rect(hx+1, hy+1, 5, 1, C.pdBel);
      rect(hx+1, hy+1, 1, 4, C.pdBel);
    } else if (id === 'jester') {
      rect(hx+1, hy+3, 6, 3, C.jest1);
      rect(hx+4, hy+3, 3, 3, C.jest2);
      rect(hx,   hy+1, 2, 3, C.jest1);
      rect(hx+6, hy+1, 2, 3, C.jest2);
      px(hx,   hy, C.yellow);
      px(hx+7, hy, C.yellow);
      px(hx+3, hy+1, C.yellow);
    } else if (id === 'shades') {
      rect(hx,   hy+1, 8, 1, C.sqEye);
      rect(hx,   hy+2, 8, 3, C.sqEye);
      rect(hx+1, hy+2, 2, 2, C.lens);
      rect(hx+5, hy+2, 2, 2, C.lens);
      px(hx+1, hy+2, C.wing);
      px(hx+5, hy+2, C.wing);
    } else if (id === 'shell') {
      rect(hx+1, hy+1, 6, 5, C.beet2);      // domed carapace
      rect(hx+2, hy+2, 4, 4, C.beet1);
      rect(hx+3, hy+1, 2, 5, C.beet2);      // the split down the back
      px(hx+2, hy+3, C.steel);              // a sheen on it
      px(hx, hy+5, C.beet2);
      px(hx+7, hy+5, C.beet2);
    } else if (id === 'mushroom') {
      rect(hx+1, hy+4, 6, 2, C.pdBel);      // pale stalk
      rect(hx, hy+2, 8, 2, C.red);          // the cap
      rect(hx+1, hy+1, 6, 1, C.red);
      rect(hx+3, hy, 2, 1, C.red);
      px(hx+2, hy+2, C.text);               // spots
      px(hx+5, hy+1, C.text);
      px(hx+4, hy+3, C.text);
    } else if (id === 'cowboy') {
      rect(hx+2, hy, 4, 4, C.pd2);          // crown
      rect(hx+3, hy, 2, 4, C.pd1);
      rect(hx+2, hy+2, 4, 1, C.mole2);      // band
      rect(hx, hy+4, 8, 2, C.pd2);          // the big brim
      rect(hx, hy+4, 8, 1, C.pd1);
    } else if (id === 'party') {
      px(hx+4, hy-2, C.coin1);              // pompom
      rect(hx+3, hy-1, 2, 2, C.magic1);     // cone, striped
      rect(hx+2, hy+1, 4, 2, C.red);
      rect(hx+1, hy+3, 6, 2, C.magic1);
      rect(hx+1, hy+5, 6, 1, C.coin1);
    } else if (id === 'space') {
      rect(hx+1, hy+1, 6, 4, C.wing);       // the dome
      rect(hx+2, hy, 4, 6, C.wing);
      rect(hx+2, hy+2, 4, 3, C.lens);       // tinted glass
      px(hx+2, hy+1, C.text);               // glint
      rect(hx, hy+5, 8, 1, C.steelD);       // collar
    } else if (id === 'propeller') {
      rect(hx+1, hy+3, 6, 3, C.prop1);      // beanie
      rect(hx+2, hy+2, 4, 1, C.prop2);
      rect(hx+3, hy+1, 2, 1, C.prop2);      // stalk
      if ((Math.floor(performance.now() / 70) % 2) === 0) {
        rect(hx, hy, 8, 1, C.prop2);        // blades edge-on
      } else {
        rect(hx+3, hy-1, 2, 1, C.prop2);
        rect(hx+3, hy+1, 2, 1, C.prop2);
      }
    }
  }

  // Perch a hat on a 16x16 worm sprite whose top-left is (sx, sy) in screen px.
  function drawHatOn(sx, sy, dir, id) {
    if (!id || id === 'none') return;
    const nudge = dir === 'R' ? 2 : dir === 'L' ? -2 : 0;
    drawHat((sx + 4 + nudge)|0, (sy + 1)|0, id);
  }

  function drawCoin(x, y) {
    rect(x+1, y,   4, 6, C.coin2);
    rect(x,   y+1, 6, 4, C.coin2);
    rect(x+1, y+1, 4, 4, C.coin1);
    rect(x+2, y+2, 1, 2, C.coin2);
  }

  // Slugbuck: green, with a little squiggle stamped on it
  function drawSlugBuck(x, y) {
    rect(x+1, y,   4, 6, C.slug2);
    rect(x,   y+1, 6, 4, C.slug2);
    rect(x+1, y+1, 4, 4, C.slug1);
    px(x+1, y+2, C.slug2);
    px(x+2, y+3, C.slug2);
    px(x+3, y+2, C.slug2);
    px(x+4, y+3, C.slug2);
  }

  // Draw an icon + amount, returns the width used
  function drawPurse(x, y, icon, amount, color) {
    const txt = String(amount);
    if (icon === 'slug') drawSlugBuck(x, y - 1);
    else drawCoin(x, y - 1);
    drawText(txt, x + 8, y, color, 1);
    return 8 + txt.length * 4;
  }

  // Fat coin used as the title-screen button
  function drawCoinButton() {
    const x = coinBtnBounds.x + 4, y = coinBtnBounds.y + 4;   // 16x16
    rect(x+4, y,   8, 16, C.coin2);
    rect(x,   y+4, 16, 8, C.coin2);
    rect(x+2, y+2, 12, 12, C.coin2);
    rect(x+5, y+1, 6, 14, C.coin1);
    rect(x+1, y+5, 14, 6, C.coin1);
    rect(x+3, y+3, 10, 10, C.coin1);
    drawText('C', x+6, y+6, C.coin2, 1);
  }

  // Chunky pressable slab, also used for the entry boxes
  function drawSlab(x, y, w, h) {
    rect(x, y, w, h, '#3a1c0a');
    rect(x, y, w, 1, C.dirt1);
    rect(x, y, 1, h, C.dirt1);
    rect(x + w - 1, y, 1, h, '#000');
    rect(x, y + h - 1, w, 1, '#000');
  }

  // 3x4 keypad. Returns the y just past the last row.
  function drawKeypad(baseY) {
    keypadBounds.length = 0;
    const bw = 32, bh = 20, gap = 6;
    const x0 = Math.floor((VW - (3 * bw + 2 * gap)) / 2);
    for (let r = 0; r < KEYPAD_KEYS.length; r++) {
      for (let c = 0; c < 3; c++) {
        const key = KEYPAD_KEYS[r][c];
        const x = x0 + c * (bw + gap);
        const y = baseY + r * (bh + gap);
        drawSlab(x, y, bw, bh);
        const color = key === 'OK' ? C.sq1 : key === 'DEL' ? C.red : C.yellow;
        drawText(key, x + Math.floor((bw - key.length * 4) / 2), y + 7, color, 1);
        keypadBounds.push({ x, y, w: bw, h: bh, key });
      }
    }
    return baseY + KEYPAD_KEYS.length * (bh + gap);
  }

  function drawBackButton(y) {
    const w = 16;
    const x = Math.floor((VW - w) / 2);
    drawText('BACK', x, y, C.text, 1);
    backBtnBounds.x = x - 12;
    backBtnBounds.y = y - 5;
    backBtnBounds.w = w + 24;
    backBtnBounds.h = 15;
  }

  function drawCodeScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0, HUD_H, VW, PLAY_H);
    drawCenter('ENTER CODE', 26, C.yellow, 2);

    // Four digit slots
    const sw = 14, sgap = 6;
    const x0 = Math.floor((VW - (4 * sw + 3 * sgap)) / 2);
    for (let i = 0; i < 4; i++) {
      const x = x0 + i * (sw + sgap);
      drawSlab(x, 46, sw, 18);
      if (codeEntry[i]) drawText(codeEntry[i], x + 4, 51, C.coin1, 2);
      else drawText('-', x + 4, 51, '#6b2a08', 2);
    }

    const endY = drawKeypad(74);
    if (codeMsgTimer > 0) drawCenter(codeMsg, endY + 1, codeMsgColor, 1);
    drawBackButton(endY + 15);
  }

  function drawCheatScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0, HUD_H, VW, PLAY_H);
    drawCenter('COIN MACHINE', 22, C.coin1, 2);

    // Pick which currency the payout lands in
    curBtnBounds.length = 0;
    const btnW = 56, btnH = 13, btnGap = 6;
    let bx = Math.floor((VW - (btnW * 2 + btnGap)) / 2);
    for (const opt of [{ cur: 'coin', label: 'COINS' }, { cur: 'slug', label: 'BUCKS' }]) {
      const on = grantCurrency === opt.cur;
      drawSlab(bx, 38, btnW, btnH);
      if (on) rect(bx + 1, 39, btnW - 2, btnH - 2, '#5c3a16');
      const col = on ? (opt.cur === 'slug' ? C.slug1 : C.coin1) : '#8b6a40';
      drawText(opt.label, bx + Math.floor((btnW - opt.label.length * 4) / 2), 42, col, 1);
      curBtnBounds.push({ x: bx, y: 38, w: btnW, h: btnH, cur: opt.cur });
      bx += btnW + btnGap;
    }

    const shown = coinEntry || '0';
    const tw = shown.length * 8;
    const bw = Math.max(tw + 12, 56);
    drawSlab(Math.floor((VW - bw) / 2), 56, bw, 18);
    drawText(shown, Math.floor((VW - tw) / 2), 61, grantCurrency === 'slug' ? C.slug1 : C.coin1, 2);

    const endY = drawKeypad(80);
    if (codeMsgTimer > 0) drawCenter(codeMsg, endY + 1, codeMsgColor, 1);
    drawBackButton(endY + 15);
  }

  // The Jester Ant: 32x32 of motley, and he blinks in and out of view.
  function drawJester(p) {
    const sx = p.x|0, sy = (p.y + HUD_H)|0;
    const flash = p.hurtFlash > 0 && (p.hurtFlash % 8) < 4;
    const red  = flash ? C.text : C.jest1;
    const pur  = flash ? C.text : C.jest2;
    const dark = flash ? C.rock2 : C.antD;
    const puff = Math.min(3, p.pumped) * 2;

    const prev = ctx.globalAlpha;
    if (p.mode === 'vanish') ctx.globalAlpha = Math.max(0.15, p.phase / 30);
    else if (p.mode === 'appear') ctx.globalAlpha = Math.min(1, 1 - p.phase / 20);

    // six legs
    rect(sx+4,  sy+20, 7, 1, dark);  rect(sx+4,  sy+20, 1, 4, dark);
    rect(sx+3,  sy+25, 8, 1, dark);  rect(sx+3,  sy+25, 1, 4, dark);
    rect(sx+21, sy+20, 7, 1, dark);  rect(sx+27, sy+20, 1, 4, dark);
    rect(sx+21, sy+25, 8, 1, dark);  rect(sx+28, sy+25, 1, 4, dark);

    // abdomen, split down the middle like motley
    rect(sx+9-puff,  sy+22-puff, 14+puff*2, 10+puff, dark);
    rect(sx+10-puff, sy+23-puff,  6+puff,    8+puff, red);
    rect(sx+16,      sy+23-puff,  6+puff,    8+puff, pur);

    // thorax
    rect(sx+12, sy+17, 8, 6, dark);
    rect(sx+13, sy+18, 3, 4, pur);
    rect(sx+16, sy+18, 3, 4, red);

    // ruff
    rect(sx+9, sy+15, 14, 2, C.yellow);

    // head

  function drawKnight(p) {

    const body = flash ? C.text : C.beet1;
    const dark = flash ? C.rock2 : C.beet2;
    const puff = Math.min(3, p.pumped) * 2;
    const rear = p.mode === 'rear' && (Math.floor(p.wiggle = (p.wiggle || 0) + 0.3) % 2) === 0;

    // six legs
    rect(sx+1,  sy+12, 5, 2, dark);
    rect(sx+1,  sy+20, 5, 2, dark);
    rect(sx+26, sy+12, 5, 2, dark);
    rect(sx+26, sy+20, 5, 2, dark);

    // carapace
    rect(sx+4-puff,  sy+6-puff,  24+puff*2, 22+puff, dark);
    rect(sx+6-puff,  sy+8-puff,  20+puff*2, 18+puff, body);
    rect(sx+9,  sy+11, 14, 2, dark);          // the split down the shell
    rect(sx+15, sy+8,  2, 20, dark);

    // head and horns, up top
    rect(sx+11, sy+1, 10, 7, dark);
    rect(sx+12, sy+2, 8, 5, body);
    rect(sx+13, sy+3, 2, 2, C.red);           // big red eyes

    const d = p.dir;

  function drawBossHealth(sx, sy, p) {
    // Normally above their head; slides under them when they hug the ceiling
    const above = sy - 5;
    const barY = above >= HUD_H + 2 ? above : sy + BOSS_SIZE + 2;
    const bw = 28;
    const fill = Math.max(0, Math.round(bw * p.hp / p.maxHp));
    rect(sx+1, barY-1, bw+2, 5, C.rockD);
    rect(sx+2, barY,   bw,   3, '#000000');
    rect(sx+2, barY,   fill, 3, p.hp <= p.maxHp / 2 ? C.red : C.sq1);
    // Flashing red outline: he is rearing up to swing. Let go.
    if (lashWinding(p) && (p.lash % 8) < 4) {
      rect(sx, sy, BOSS_SIZE, 1, C.red);
      rect(sx, sy + BOSS_SIZE - 1, BOSS_SIZE, 1, C.red);
      rect(sx, sy, 1, BOSS_SIZE, C.red);
      rect(sx + BOSS_SIZE - 1, sy, 1, BOSS_SIZE, C.red);
    }
  }

  function drawAsmScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    ctx.fillRect(0, HUD_H, VW, PLAY_H);
    drawCenter('ASM', 20, C.slug1, 2);
    drawCenter('AUTO SLUG MACHINE', 34, C.text, 1);

    // What you have, in both currencies
    const pw = (8 + String(slugs).length * 4) + 14 + (8 + String(coins).length * 4);
    let pxx = Math.floor((VW - pw) / 2);
    pxx += drawPurse(pxx, 46, 'slug', slugs, C.slug1) + 14;
    drawPurse(pxx, 46, 'coin', coins, C.coin1);

    drawCenter(asmDir === 'buy'
      ? 'BUY 1 BUCK: ' + ASM_BUY_RATE + ' COINS'
      : 'SELL 1 BUCK: ' + ASM_RATE + ' COINS', 58, C.yellow, 1);

    asmBounds.length = 0;

    // Which way round the machine is pointing
    const DIRS = [
      { dir: 'sell', label: 'BUCKS TO COINS' },
      { dir: 'buy',  label: 'COINS TO BUCKS' },
    ];
    const dw = 72, dh = 13, dgap = 6;
    let dx = Math.floor((VW - (dw * DIRS.length + dgap * (DIRS.length - 1))) / 2);
    for (let i = 0; i < DIRS.length; i++) {
      const on = asmDir === DIRS[i].dir;
      const sel = asmIndex === i;
      drawSlab(dx, 70, dw, dh);
      if (on) rect(dx + 1, 71, dw - 2, dh - 2, '#5c3a16');
      if (sel) {
        rect(dx, 70, dw, 1, C.yellow);
        rect(dx, 70 + dh - 1, dw, 1, C.yellow);
        rect(dx, 70, 1, dh, C.yellow);
        rect(dx + dw - 1, 70, 1, dh, C.yellow);
      }
      drawText(DIRS[i].label, dx + Math.floor((dw - DIRS[i].label.length * 4) / 2), 74,
               on ? C.slug1 : '#8b6a40', 1);
      asmBounds.push({ x: dx, y: 70, w: dw, h: dh, idx: i });
      dx += dw + dgap;
    }

    drawCenter(asmDir === 'buy' ? 'BUY SLUGBUCKS' : 'CASH IN SLUGBUCKS', 88, C.text, 1);

    const bw = 40, bh = 16, gap = 6;
    let bx = Math.floor((VW - (ASM_AMOUNTS.length * bw + (ASM_AMOUNTS.length - 1) * gap)) / 2);
    for (let i = 0; i < ASM_AMOUNTS.length; i++) {
      const label = String(ASM_AMOUNTS[i]);
      const sel = asmIndex === ASM_IDX_AMOUNT0 + i;
      drawSlab(bx, 98, bw, bh);
      if (sel) rect(bx + 1, 99, bw - 2, bh - 2, '#5c3a16');
      drawText(label, bx + Math.floor((bw - label.length * 4) / 2), 103, sel ? C.yellow : C.slug1, 1);
      asmBounds.push({ x: bx, y: 98, w: bw, h: bh, idx: ASM_IDX_AMOUNT0 + i });
      bx += bw + gap;
    }

    if (asmMsgTimer > 0) drawCenter(asmMsg, 120, asmMsgColor, 1);

    // The machine's slug. Poke him and he says hello.
    drawSlug(SLUG_POS.x, SLUG_POS.y, slugAngry > 0);
    asmBounds.push({
      x: SLUG_POS.x - 6, y: SLUG_POS.y - 6,
      w: SLUG_POS.w + 12, h: SLUG_POS.h + 12,
      idx: ASM_IDX_SLUG,
    });
    if (asmIndex === ASM_IDX_SLUG) drawPointer(SLUG_POS.x - 16, SLUG_POS.y + 6);
    if (slugTalk > 0) drawSpeechBubble(SLUG_POS.x + 13, SLUG_POS.y, slugLine);

    drawBackButton(184);
    asmBounds.push({
      x: backBtnBounds.x, y: backBtnBounds.y,
      w: backBtnBounds.w, h: backBtnBounds.h,
      idx: ASM_IDX_BACK,
    });
    if (asmIndex === ASM_IDX_BACK) drawPointer(backBtnBounds.x - 2, 184);

    drawCenter('ARROWS: PICK   ENTER: OK', VH - 12, C.text, 1);
  }

  function drawBossPick() {
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0, HUD_H, VW, PLAY_H);
    drawCenter('WANTED', 24, C.paper, 2);
    drawCenter('PICK A FIGHT', 44, C.text, 1);

    bossPickBounds.length = 0;
    const rows = WANTED.length + 1;
    const baseY = 62, lineH = 32;
    for (let i = 0; i < rows; i++) {
      const y = baseY + i * lineH;
      const sel = bossPickIndex === i;
      if (i === WANTED.length) {
        const label = 'BACK';
        const lx = Math.floor((VW - label.length * 4) / 2);
        drawText(label, lx, y, sel ? C.yellow : C.text, 1);
        if (sel) drawPointer(lx - 12, y);
        bossPickBounds.push({ x: lx - 16, y: y - 5, w: label.length * 4 + 24, h: 14, idx: i });
        continue;
      }
      const w = WANTED[i];
      if (w.face === 'queen') drawQueenFace(62, y - 2);
      else if (w.face === 'king') drawKingFace(62, y - 2);
      else if (w.face === 'knight') drawKnightFace(62, y - 2);
      else drawJesterFace(62, y - 2);
      drawText(w.label, 96, y + 4, sel ? C.yellow : C.text, 1);
      drawText('BURROW ' + w.level, 96, y + 16, C.rock1, 1);
      if (sel) drawPointer(84, y + 4);
      bossPickBounds.push({ x: 56, y: y - 4, w: 150, h: 28, idx: i });
    }

    drawCenter('ENTER: FIGHT   ESC: BACK', VH - 12, C.text, 1);
  }

  // Worker ant at (x, y), seen from above so it reads walking any direction.
  function drawAnt(x, y, pump) {
    const sx = x|0, sy = (y + HUD_H)|0;
    if (pump >= 1) {
      const sz = 12 + Math.floor(pump);
      const ox = sx + Math.floor((16 - sz) / 2);
      const oy = sy + Math.floor((16 - sz) / 2);
      rect(ox, oy+1, sz, sz-2, C.antD);
      rect(ox+1, oy, sz-2, sz, C.antD);
      rect(ox+1, oy+1, sz-2, sz-2, C.ant1);
      px(ox+3, oy+3, C.pupil);
      px(ox+sz-4, oy+3, C.pupil);
      rect(ox+Math.floor(sz/2)-1, oy+Math.floor(sz/2)+1, 2, 2, C.pupil);
      return;
    }
    // six legs, behind the body
    rect(sx+2,  sy+6, 4, 1, C.antD);  rect(sx+2,  sy+6, 1, 2, C.antD);
    rect(sx+2,  sy+9, 4, 1, C.antD);  rect(sx+2,  sy+9, 1, 3, C.antD);
    rect(sx+10, sy+6, 4, 1, C.antD);  rect(sx+13, sy+6, 1, 2, C.antD);
    rect(sx+10, sy+9, 4, 1, C.antD);  rect(sx+13, sy+9, 1, 3, C.antD);
    // abdomen, thorax, head
    rect(sx+5, sy+9, 6, 5, C.antD);
    rect(sx+6, sy+9, 4, 4, C.ant1);
    rect(sx+6, sy+5, 4, 4, C.antD);
    rect(sx+6, sy+6, 3, 2, C.ant1);
    rect(sx+5, sy+1, 6, 4, C.antD);
    rect(sx+6, sy+2, 4, 2, C.ant1);
    // antennae and eyes
    px(sx+4, sy, C.antD);
    px(sx+11, sy, C.antD);
    px(sx+6, sy+2, C.pupil);
    px(sx+9, sy+2, C.pupil);
  }

  // Prairie dog sprite at (x, y), pump level 0..3
  function drawPD(x, y, dir, pump) {
    const sx = x|0, sy = (y + HUD_H)|0;
    const scale = 1 + pump * 0.15;
    const grow = Math.floor(pump);
    // Inflate: draw a larger circle when pumped
    if (pump >= 1) {
      // bloated body
      const sz = 12 + grow * 1;
      const ox = sx + Math.floor((16 - sz) / 2);
      const oy = sy + Math.floor((16 - sz) / 2);
      rect(ox, oy+1, sz, sz-2, C.pd2);
      rect(ox+1, oy, sz-2, sz, C.pd2);
      rect(ox+1, oy+1, sz-2, sz-2, C.pd1);
      rect(ox+2, oy+2, sz-4, sz-4, C.pdBel);
      // tiny eyes
      px(ox+3, oy+3, C.pupil);
      px(ox+sz-4, oy+3, C.pupil);
      // mouth O
      rect(ox+Math.floor(sz/2)-1, oy+Math.floor(sz/2)+1, 2, 2, C.pupil);
      return;
    }

    // Standing prairie dog (8-bit chunky)
    // Body
    rect(sx+4, sy+6, 8, 8, C.pd2);
    rect(sx+5, sy+6, 6, 8, C.pd1);
    // Belly
    rect(sx+6, sy+9, 4, 4, C.pdBel);
    // Head
    rect(sx+5, sy+2, 6, 5, C.pd2);
    rect(sx+6, sy+2, 4, 5, C.pd1);
    // Snout
    rect(sx+7, sy+5, 2, 2, C.pdBel);
    // Ears
    px(sx+5, sy+1, C.pd2);
    px(sx+10, sy+1, C.pd2);
    // Eyes
    px(sx+6, sy+3, C.pupil);
    px(sx+9, sy+3, C.pupil);
    // Nose
    px(sx+7, sy+5, C.pupil);
    // Arms (little paws)
    rect(sx+3, sy+7, 1, 3, C.pd2);
    rect(sx+12, sy+7, 1, 3, C.pd2);
    // Feet
    rect(sx+4, sy+13, 3, 2, C.pd2);
    rect(sx+9, sy+13, 3, 2, C.pd2);
    // Direction-tint: face shift
    if (dir === 'L') { px(sx+5, sy+3, C.pupil); }
    if (dir === 'R') { px(sx+10, sy+3, C.pupil); }
  }

  // Squiggle sprite: a wavy green critter (16x16) facing dir
  function drawSquiggle(x, y, dir, phase, pump) {
    const sx = x|0, sy = (y + HUD_H)|0;
    if (pump >= 1) {
      // Same bloated body as PDs when squirted, just green
      const grow = Math.floor(pump);
      const sz = 12 + grow * 1;
      const ox = sx + Math.floor((16 - sz) / 2);
      const oy = sy + Math.floor((16 - sz) / 2);
      rect(ox, oy+1, sz, sz-2, C.sq2);
      rect(ox+1, oy, sz-2, sz, C.sq2);
      rect(ox+1, oy+1, sz-2, sz-2, C.sq1);
      // tiny eyes
      px(ox+3, oy+3, C.sqEye);
      px(ox+sz-4, oy+3, C.sqEye);
      // mouth O
      rect(ox+Math.floor(sz/2)-1, oy+Math.floor(sz/2)+1, 2, 2, C.sqEye);
      return;
    }
    // Six 2x3 segments arranged in a sine wave across the sprite
    // phase animates the wave shape
    const horizontal = dir === 'L' || dir === 'R';
    const segs = 6;
    for (let i = 0; i < segs; i++) {
      const t = (i + phase) * 0.9;
      const wave = Math.round(Math.sin(t) * 2);   // -2..+2
      let cx, cy;
      if (horizontal) {
        cx = sx + 2 + i * 2;
        cy = sy + 7 + wave;
      } else {
        cx = sx + 7 + wave;
        cy = sy + 2 + i * 2;
      }
      rect(cx, cy, 3, 3, C.sq2);
      rect(cx, cy, 2, 2, C.sq1);
    }
    // Head: extra blob with an eye on the leading end
    let hx, hy;
    if (dir === 'R')      { hx = sx + 13; hy = sy + 7 + Math.round(Math.sin((segs + phase) * 0.9) * 2); }
    else if (dir === 'L') { hx = sx + 0;  hy = sy + 7 + Math.round(Math.sin((-1 + phase) * 0.9) * 2); }
    else if (dir === 'D') { hx = sx + 7 + Math.round(Math.sin((segs + phase) * 0.9) * 2); hy = sy + 13; }
    else                  { hx = sx + 7 + Math.round(Math.sin((-1 + phase) * 0.9) * 2); hy = sy + 0; }
    rect(hx, hy, 3, 3, C.sq2);
    rect(hx, hy, 2, 2, C.sq1);
    // Eye
    if (dir === 'R')      px(hx + 2, hy + 0, C.sqEye);
    else if (dir === 'L') px(hx + 0, hy + 0, C.sqEye);
    else if (dir === 'D') px(hx + 0, hy + 2, C.sqEye);
    else                  px(hx + 0, hy + 0, C.sqEye);
  }

  function drawSquirt(ent, color) {
    if (!ent || !ent.squirting || !ent.squirtTarget) return;
    const cx = ent.x + 8;
    const cy = ent.y + 8 + HUD_H;
    const tgt = ent.squirtTarget;
    const tx = tgt.x + 8;
    const ty = tgt.y + 8 + HUD_H;
    // The ink turns red when the boss on the end of it is about to swing
    ctx.fillStyle = lashWinding(tgt) ? C.red : color;
    // Draw dotted line of squirt particles
    const dx = tx - cx, dy = ty - cy;
    const len = Math.hypot(dx, dy);
    const steps = Math.max(2, Math.floor(len / 3));
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const wob = ((ent.squirtTimer + i * 3) % 6) - 3;
      const px = cx + dx * t + (Math.abs(dx) > 0 ? 0 : wob);
      const py = cy + dy * t + (Math.abs(dy) > 0 ? 0 : wob);
      ctx.fillRect((px-1)|0, (py-1)|0, 2, 2);
    }
  }

  function drawText(str, x, y, color, scale = 1) {
    str = str.toUpperCase();
    let cx = x;
    for (let i = 0; i < str.length; i++) {
      let ch = str[i];
      if (ch === 'X' && /[0-9]/.test(str[i-1] || '')) ch = 'x';
      const glyph = FONT[ch] || FONT[' '];
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 3; c++) {
          if (glyph[r][c] === '1') {
            ctx.fillStyle = color;
            ctx.fillRect(cx + c*scale, y + r*scale, scale, scale);
          }
        }
      }
      cx += 4 * scale;
    }
  }

  function draw() {
    rect(0, 0, VW, VH, '#000');
    drawHUD();
    // Sky/grass strip at very top of play area (just visual)
    // Tiles
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = grid[r][c];
        if (t === DIRT) drawDirtTile(c, r);
        else if (t === EMPTY) drawTunnelTile(c, r);
        else if (t === ROCK) drawRockTile(c, r);
      }
    }
    drawBlackHole();
    drawMines();
    // Falling rocks
    for (const rk of rocks) {
      drawRockAt(rk.x, rk.y + HUD_H);
    }
    // Enemies (prairie dogs + squiggles)
    for (const p of pds) {
      if (!p.alive) continue;
      if (p.type === 'knight') drawKnight(p);
      else if (p.type === 'king') drawKing(p);
      else if (p.type === 'jester') drawJester(p);
      else if (p.type === 'queen') drawQueen(p);
      else if (p.type === 'squiggle') drawSquiggle(p.x, p.y, p.dir, p.wiggle, p.pumped);
      else if (p.type === 'ant') drawAnt(p.x, p.y, p.pumped);
      else drawPD(p.x, p.y, p.dir, p.pumped);
    }
    drawBoomerang();
    // Conjured helper worm
    if (helper) {
      if (helper.invuln <= 0 || (helper.invuln % 6) < 3) {
        drawWorm(helper.x, helper.y, helper.dir, helper.bodyTrail, C.help1, C.help2);
        drawHatOn(helper.x, helper.y + HUD_H, helper.dir, 'magic');
      }
      drawSquirt(helper, C.magic1);
      drawHelperLives(helper);
    }
    // Player
    if (player.alive) {
      if (player.invuln <= 0 || (player.invuln % 6) < 3) {
        drawWorm(player.x, player.y, player.dir, player.bodyTrail, C.worm1, C.worm2);
        drawHatOn(player.x, player.y + HUD_H, player.dir, equipped);
      }
    }
    // Squirt
    drawSquirt(player, C.squirt);
    if (armorFlash > 0 && gameState === 'play') {
      drawCenter('CLANG!', VH/2 - 40, C.steel, 2);
    }
    if (gadgetMsgTimer > 0 && gameState === 'play') {
      drawCenter(gadgetMsg, VH/2 - 40, C.red, 1);
    }
    if (helperGoneMsg > 0 && gameState === 'play') {
      drawCenter('YOUR HELPER IS GONE!', VH/2 - 28, C.help1, 1);
    }
    if (sporeFlash > 0 && gameState === 'play') {
      drawSpores(sporeAt.x, sporeAt.y + HUD_H, sporeFlash);
    }
    if (blastFlash > 0 && gameState === 'play') {
      drawBlast(blastAt.x, blastAt.y + HUD_H, blastFlash);
    }
    if (bossGuardMsg > 0 && gameState === 'play') {
      drawCenter('ROCKS BOUNCE OFF!', VH/2 - 52, C.rock1, 1);
    }
    if (shieldMsg > 0 && gameState === 'play') {
      drawCenter('GET BEHIND HIM!', VH/2 - 52, C.steel, 1);
    }
    if (shellFlash > 0 && gameState === 'play') {
      drawCenter('THE SHELL HOLDS! ' + shellLeft + ' LEFT', VH/2 - 40, C.beet1, 1);
    }
    if (gameState === 'play' && player.squirting && lashWinding(player.squirtTarget)
        && (Math.floor(performance.now()/120) % 2) === 0) {
      drawCenter('LET GO!', VH/2 - 64, C.red, 2);
    }

    // Overlays
    if (gameState === 'menu') {
      drawMenu();
    } else if (gameState === 'shop') {
      drawShop();
    } else if (gameState === 'cursors') {
      drawCursorShop();
    } else if (gameState === 'asm') {
      drawAsmScreen();
    } else if (gameState === 'bosspick') {
      drawBossPick();
    } else if (gameState === 'code') {
      drawCodeScreen();
    } else if (gameState === 'cheat') {
      drawCheatScreen();
    } else if (gameState === 'howto') {
      drawHowTo();
    } else if (gameState === 'dead') {
      drawCenter(
        deathCause === 'squish' ? 'SQUISHED!' :
        deathCause === 'tangle' ? 'TANGLED!' :
        deathCause === 'ant'    ? 'NIPPED!' :
        deathCause === 'queen'  ? 'FLATTENED!' :
        deathCause === 'king'   ? 'STUNG!' :
        deathCause === 'jester' ? 'BITTEN!' :
        'CHOMPED!',
        VH/2, C.red, 2
      );
    } else if (gameState === 'win') {
      drawCenter('LEVEL ' + (level-1) + ' CLEAR', VH/2, C.yellow, 1);
      const boss = level === KING_LEVEL ? 'THE KINGS NEST!'
                 : level === QUEEN_LEVEL ? 'THE QUEENS BURROW!'
                 : level === JESTER_LEVEL ? 'THE JESTERS HILL!' : null;
      drawCenter(boss || 'NEXT BURROW', VH/2 + 12, boss ? C.red : C.text, 1);
    } else if (gameState === 'bosswin') {
      drawCenter(bossWin.title, VH/2 - 26, C.yellow, 2);
      drawCenter(bossWin.prize, VH/2, C.red, 1);
      drawCenter('WEAR IT FROM THE SHOP', VH/2 + 12, C.text, 1);
      drawCenter('DEEPER BURROWS AHEAD...', VH/2 + 30, C.text, 1);
    } else if (gameState === 'beat') {
      drawCenter('THE JESTER FALLS', VH/2 - 34, C.yellow, 2);
      drawCenter('SCORE ' + score, VH/2 - 8, C.text, 1);
      drawCenter('COINS +' + runCoins, VH/2 + 4, C.coin1, 1);
      drawCenter('SLUGBUCKS +' + runSlugs, VH/2 + 16, C.slug1, 1);
      drawCenter('YOU WON HIS CAP', VH/2 + 34, C.jest1, 1);
      drawCenter('WEAR IT FROM THE SHOP', VH/2 + 46, C.text, 1);
      if ((Math.floor(performance.now()/400) % 2) === 0) {
        drawCenter('PRESS ENTER', VH/2 + 62, C.text, 1);
      }
    } else if (gameState === 'over') {
      drawCenter('GAME OVER', VH/2 - 8, C.red, 2);
      drawCenter('SCORE ' + score, VH/2 + 16, C.text, 1);
      drawCenter('COINS +' + runCoins, VH/2 + 28, C.coin1, 1);
      drawCenter('SLUGBUCKS +' + runSlugs, VH/2 + 40, C.slug1, 1);
      if ((Math.floor(performance.now()/400) % 2) === 0) {
        drawCenter('PRESS ENTER', VH/2 + 54, C.text, 1);
      }
    }
  }

  // The flash of a mine going off
  function drawBlast(cx, cy, t) {
    const grow = (20 - t) * 1.1;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      const bx = Math.round(cx + Math.cos(a) * (3 + grow));
      const by = Math.round(cy + Math.sin(a) * (3 + grow));
      rect(bx, by, 2, 2, (i % 2) ? C.coin1 : C.red);
    }
  }

  // A little puff of spores expanding from where something popped
  function drawSpores(cx, cy, t) {
    const grow = (26 - t) * 0.7;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const px1 = Math.round(cx + Math.cos(a) * (4 + grow));
      const py1 = Math.round(cy + Math.sin(a) * (4 + grow));
      rect(px1, py1, 2, 2, (i % 2) ? C.pdBel : C.red);
    }
  }

  function drawCenter(str, y, color, scale) {
    const w = str.length * 4 * scale;
    drawText(str, Math.floor((VW - w) / 2), y, color, scale);
  }

    rect(0, HUD_H, VW, PLAY_H, 'rgba(0,0,0,0.55)');

    drawCenter('EARTHWORM', 30, C.yellow, 2);

    pxx += drawPurse(pxx, 64, 'coin', coins, C.coin1) + 12;
    drawPurse(pxx, 64, 'slug', slugs, C.slug1);

    // Draw the chosen pointer + menu items
    menuBounds.length = 0;
    const baseY = 78;
    const lineH = 12;
    for (let i = 0; i < MENU_ITEMS.length; i++) {
      const shut = i === M_ASM && asmLocked();
      const label = i === M_DIFF ? 'DIFFICULTY: ' + DIFF_NAMES[difficulty]
        : shut ? 'ASM CLOSED - ' + asmLockSeconds() + 'S'

    const tableY = baseY + MENU_ITEMS.length * lineH + 2;
    drawCenter('POINTS', tableY, C.text, 1);
    drawScoreRow(tableY + 12, 'pd', 'PRAIRIE DOG', 200, 500);
    drawScoreRow(tableY + 24, 'ant', 'ANT', 150, 350);
    drawScoreRow(tableY + 36, 'squiggle', 'SQUIGGLE',  100, 250);
    drawCenter('SQUIGGLES DROP SLUGBUCKS', tableY + 48, C.slug1, 1);

    // Secret buttons, up top and clear of the touch controls
    drawCoinButton();
    drawWantedButton();

    // Hint at bottom - the difficulty row has its own
    if (menuIndex === M_DIFF) drawCenter('LEFT/RIGHT TO CHANGE', VH - 14, C.red, 1);
